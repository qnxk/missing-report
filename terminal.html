<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>system</title>

<style>
@font-face {
    font-family: 'VCR';
    src: url('VCR_OSD_MONO.ttf');
}

body {
    margin: 0;
    background: black;
    font-family: 'VCR', monospace;
    overflow: hidden;
}

body::after {
    content: "";
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
        to bottom,
        rgba(255,255,255,0.08),
        rgba(255,255,255,0.08) 2px,
        rgba(0,0,0,0) 4px
    );
    pointer-events: none;
    z-index: 1000;
}

#terminal {
    padding: 20px;
}

.line {
    position: relative;
    color: white;
    font-size: 18px;
    white-space: pre;
}

.line::before,
.line::after {
    content: attr(data-text);
    position: absolute;
    left: 0;
    top: 0;
}

.line::before {
    color: red;
    opacity: 0.3;
    transform: translate(2px,0);
}

.line::after {
    color: cyan;
    opacity: 0.3;
    transform: translate(-2px,0);
}

input {
    background: black;
    border: none;
    color: white;
    width: 100%;
    outline: none;
}

.glitch {
    color:#ff4444;
    animation: glitch 0.1s infinite;
}

@keyframes glitch {
    0% {transform:translate(0);}
    50% {transform:translate(2px,-1px);}
    100% {transform:translate(-2px,1px);}
}

#videoContainer {
    display:none;
    position:fixed;
    inset:0;
    background:black;
}

#videoContainer img {
    width:100%;
    height:100%;
    object-fit:cover;
}

#exitBtn {
    position:absolute;
    top:20px;
    right:20px;
    border:1px solid red;
    padding:10px;
    cursor:pointer;
}
</style>
</head>

<body>

<div id="terminal">
    <div id="output"></div>
    <div>> <input id="input" autofocus></div>
</div>

<div id="videoContainer">
    <button id="exitBtn" onclick="exitVideo()">EXIT</button>
    <img id="simVideo" src="Sim_01.gif">
</div>

<script>
const output = document.getElementById("output");
const input = document.getElementById("input");

// файлы остаются
const fileData = {
    "Kindness.txt": "KINDNESS...",
    "Patience.txt": "PATIENCE...",
    "Uriel.log": "URIEL...",
    "TFH.txt": "TFH...",
    "The Greed.txt": "GREED...",
    "The Wrath.txt": "WRATH...",
    "The Deadman.txt": "DEADMAN...",
    "Osiris.txt": "OSIRIS...",
    "The Fool.txt": "FOOL...",
    "PrototypeA2.txt": "A2...",
    "The Neither.txt": "NEITHER...",
    "Last Signal.wav": "SIGNAL..."
};

function typeLine(text, cls=""){
    const d=document.createElement("div");
    d.className="line "+cls;
    d.textContent=text;
    d.setAttribute("data-text",text);
    output.appendChild(d);
}

function delayed(t, time, cls=""){
    setTimeout(()=>typeLine(t,cls),time);
}

typeLine("ENTER CODE:");

input.addEventListener("keydown", e=>{
if(e.key==="Enter"){
let v=input.value.toUpperCase().trim();
input.value="";
typeLine("> "+v);

// ABA
if(v===atob("QUJB")){
    openVideo();
    return;
}

// COMMANDER
if(v==="COMMANDER"){
    delayed("AUTHORITY DETECTED",300);
    delayed("Squad Seven, advance.",800);
    delayed("Move out.",1400);
    return;
}

// FLAWED
if(v==="THEFLAWEDVIRTUE"){
    delayed("CORRUPTION TRACE",300,"glitch");
    delayed("Old name: THE NEITHER",900);
    delayed("New: THE FLAWED VIRTUE",1500);
    delayed("Something is wrong.",2200);
    return;
}

// ENDOSCOPY
if(v==="ENDOSCOPY"){
    startEndoscopy();
    return;
}

// WHITE DEATH
if(v==="WHITEDEATH"){
    delayed("HOSTILE ENTITY",200,"glitch");
    delayed("WHITE DEATH",800,"glitch");
    delayed("HERETIC",1400,"glitch");
    delayed("Limiter failed.",2000,"glitch");
    delayed("HUNT INITIATED.",2600,"glitch");
    delayed("FIND.",3200,"glitch");
    delayed("BREAK.",3800,"glitch");

    setTimeout(()=>{
        if(Math.random()<0.6){
            typeLine("CONNECTION LOST","glitch");
            input.disabled=true;
        }
    },4500);
    return;
}

// OSIRIS
if(v==="OSIRIS"){
    delayed("UNKNOWN ENTITY",300);
    delayed("Origin undefined",900);
    delayed("Incomplete",1500);
    return;
}

// GREED
if(v==="GREED"){
    delayed("ARCHIVE FOUND",300);
    delayed("DATA ERASED",900,"glitch");
    delayed("TRUTH LOST",1500);
    return;
}

typeLine("ACCESS DENIED");
}
});

// VIDEO
function openVideo(){
document.getElementById("terminal").style.display="none";
let v=document.getElementById("videoContainer");
document.getElementById("simVideo").src="Sim_01.gif?"+Date.now();
v.style.display="block";
}

function exitVideo(){
document.getElementById("videoContainer").style.display="none";
document.getElementById("terminal").style.display="block";
input.focus();
}

// ENDOSCOPY
function startEndoscopy(){
let speed=800;

function spawn(){
let img=document.createElement("img");
img.src="m.png";
img.style.position="fixed";
img.style.width="180px";
img.style.left=Math.random()*window.innerWidth+"px";
img.style.top=Math.random()*window.innerHeight+"px";
img.style.animation="glitch 0.1s infinite";
document.body.appendChild(img);

speed*=0.8;
if(speed<40) speed=40;

setTimeout(spawn,speed);
}

spawn();
}
</script>

</body>
</html>
