<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>system</title>

<style>
@font-face {
    font-family: 'VCR';
    src: url('VCR_OSD_MONO.ttf');
}

body {
    margin: 0;
    background: black;
    font-family: 'VCR', monospace;
    overflow: hidden;
}

body::after {
    content: "";
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
        to bottom,
        rgba(255,255,255,0.08),
        rgba(255,255,255,0.08) 2px,
        rgba(0,0,0,0) 4px
    );
    pointer-events: none;
    z-index: 1000;
}

#terminal {
    padding: 20px;
    position: relative;
}

#terminal::before {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(
        circle at center,
        transparent 40%,
        rgba(0,0,0,0.7) 100%
    );
    pointer-events: none;
}

.line {
    position: relative;
    color: white;
    font-size: 18px;
    cursor: pointer;
    white-space: pre-wrap;
}

.line::before,
.line::after {
    content: attr(data-text);
    position: absolute;
    left: 0;
    top: 0;
    pointer-events: none;
    white-space: pre-wrap;
}

.line::before {
    color: red;
    opacity: 0.3;
    transform: translate(2px, 0);
}

.line::after {
    color: cyan;
    opacity: 0.3;
    transform: translate(-2px, 0);
}

.input-line {
    display: flex;
}

input {
    background: black;
    border: none;
    color: white;
    font-family: inherit;
    outline: none;
    width: 100%;
    font-size: 18px;
}

#files {
    display: none;
    padding: 20px;
    color: white;
}

#fileViewer {
    display: none;
    padding: 20px;
    color: white;
}

#backBtn {
    margin-bottom: 20px;
    border: 1px solid red;
    display: inline-block;
    padding: 5px 10px;
    cursor: pointer;
}

#videoContainer {
    display: none;
    position: fixed;
    inset: 0;
    background: black;
    z-index: 900;
}

#exitBtn {
    position: absolute;
    top: 20px;
    right: 20px;
    background: black;
    color: white;
    border: 1px solid red;
    padding: 10px;
    cursor: pointer;
    z-index: 901;
    font-family: inherit;
}

#videoContainer img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.red-file {
    color: #ff0000;
}

.uncertain-file {
    color: #d6a0a0;
}

.glitch {
    color: #ff4444;
    animation: glitch 0.1s infinite;
}

.dim {
    color: #b8b8b8;
}

@keyframes glitch {
    0% { transform: translate(0); }
    50% { transform: translate(2px, -1px); }
    100% { transform: translate(-2px, 1px); }
}

#endoContainer {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 999;
}

.endo-img {
    position: absolute;
    width: 180px;
    animation: shake 0.08s infinite;
}

@keyframes shake {
    0% { transform: translate(0, 0) rotate(0deg); }
    25% { transform: translate(3px, -3px) rotate(1deg); }
    50% { transform: translate(-3px, 3px) rotate(-1deg); }
    75% { transform: translate(3px, 3px) rotate(1deg); }
    100% { transform: translate(0, 0) rotate(0deg); }
}
</style>
</head>

<body>

<div id="terminal">
    <div id="output"></div>

    <div class="input-line">
        <span class="line" data-text="> ">> </span>
        <input id="input" autofocus>
    </div>
</div>

<div id="files"></div>

<div id="fileViewer">
    <div id="backBtn" class="line" onclick="backToFiles()" data-text="[BACK]">[BACK]</div>
    <div id="fileContent"></div>
</div>

<div id="videoContainer">
    <button id="exitBtn" onclick="exitVideo()">EXIT</button>
    <img id="simVideo" src="Sim_01.gif">
</div>

<div id="endoContainer"></div>

<script>
const output = document.getElementById("output");
const input = document.getElementById("input");

const fileData = {
    "KINDNESS.txt": `ID: V-02
Affiliation: Virtues
Status: Active

Outward benevolence. Private large-scale data suppression.

Observations:
- Authorised destruction of historical archives.

Flags:
Information Control / Manipulation of Narrative

Note:
Role conflicts with data erasure.`,

    "PATIENCE.txt": `ID: V-03
Affiliation: Virtues
Status: Active

Summary:
Order maintained through brutal suppression. Detected increased instability in nature.

Observations:
- Largescale suppression documented as 'Retribution.'
- Able to regenerate after fatal damage.
- Rising aggression detected.

Note:
Behaviour contrasts with designation.`,

    "URIEL.txt": `ID: C-01
Affiliation: Church
Status: Active

Summary:
Devotion enforced through fear and display of power.

Observations:
- Publicly displays destructive force.
- Immediate, brutal execution of heretics & infernals.
- Strong moral alignment with the Church.

Note:
Action correlation with civil unrest.`,

    "FORGOTTENHERO.txt": `ID: E-00
Affiliation: Church
Status: Active

Summary:
Remnant of a former Hero. Fragmented memory - incapable of defection.

Observations:
- Unwavering loyalty to V-02.
- Developing realisation of irregularities.

Note:
Remains loyal despite awareness of anomalies.`,

    "GREED.txt": `ID: S-01
Affiliation: Heretics
Status: Active

Observations:

    "WRATH.txt": `ID: S-02
Affiliation: Heretics
Status: Unknown

Summary:
Driven by a sense of revenge. Alleged destruction of homeland by V-03.

Observations:
- Strong resentment towards V-03. Bloodlust of unrecordable calibre.

- Permanent Termination: Unknown - Individual engaged V-03. No further record.

Note:
NIL`,

    "DEADMAN.txt": `ID: H-03
Affiliation: Heretics - DEFECT
Status: Alive(?) - Conflict

Observations:

    "OSIRIS.txt": `ID: D-00
Affiliation: Unknown
Status: Active

Summary:

Observations:

- Creator unknown.

Origin may be expunged.`,

    "FOOL.txt": `ID: ⛶-⛶⛶
Affiliation: Unknown
Status: Anomaly

Summary:
Familiar with Era of Chaos. Possible reminiscence.

Observations:
IN-PROGRESS

Note:
Subject harbours hostility towards A1.sys
Proceed with caution. Initiate any necessary protocols. Target must be neutralised.
Threat level: Unknown`,

    "PROTOTYPEA2.txt": `ID: X-00
Affiliation: Unknown
Status: Recovered Fragment

    "NEITHER.txt": `ID: X-01
Affiliation: Uncertain

    "Last Signal.wav": `ID: U-01
Affiliation: Unknown
Status: Corrupted

Summary:
Unrecoverable audio transmission.

Observations:
- Fragmented static, breathing and signal spikes.
- Unidentifiable source. Failed to trace creator. Decoding failed.

Note:
Playback not advised.`
};

function typeLine(text, cls = "", delay = 15) {
    return new Promise(resolve => {
        let i = 0;
        const div = document.createElement("div");
        div.className = "line " + cls;
        output.appendChild(div);

        function typing() {
            if (i < text.length) {
                div.textContent += text[i];
                div.setAttribute("data-text", div.textContent);
                i++;
                setTimeout(typing, delay);
            } else {
                resolve();
            }
        }

        typing();
    });
}

function delayedLine(text, time, cls = "", delay = 15) {
    setTimeout(() => typeLine(text, cls, delay), time);
}

typeLine("ENTER CODE:");

input.addEventListener("keydown", function(e) {
    if (e.key === "Enter") {
        const value = input.value.toUpperCase().trim();
        input.value = "";

        typeLine("> " + value);

        if (value === "ARCHIVE") {
            openFiles();
            return;
        }

        if (value === atob("QUJB")) {
            openVideo();
            return;
        }

        if (value === "COMMANDER") {
            delayedLine("AUTHORITY SIGNATURE DETECTED.", 300);
            delayedLine("Identity: THE SUPREME COMMANDER", 800);
            delayedLine("Order chain confirmed.", 1300);
            delayedLine("Squad Seven, advance on the heretic position.", 1900);
            delayedLine("Cannon Fodder response corrupted.", 2600, "dim");
            delayedLine("Close enough. Move out.", 3300);
            return;
        }

        if (value === "THEFLAWEDVIRTUE") {
            delayedLine("WARNING: CORRUPTION TRACE FOUND.", 300, "glitch");
            delayedLine("Old title detected: NEITHER", 900, "uncertain-file");
            delayedLine("New title unstable: FLAWED VIRTUE", 1500, "uncertain-file");
            delayedLine("Question recovered: What was sealed from me?", 2300);
            delayedLine("Suspicion: betrayal not confirmed.", 3100, "dim");
            delayedLine("System note: monitor closely.", 3900, "dim");
            return;
        }

        if (value === "ENDOSCOPY") {
            startEndoscopy();
            return;
        }

        if (value === "WHITEDEATH") {
            delayedLine("HOSTILE ENTITY DETECTED.", 200, "glitch");
            delayedLine("Designation: WHITE DEATH", 700, "glitch");
            delayedLine("Heretic class confirmed.", 1200, "glitch");
            delayedLine("Weapon familiarity: ancient rail systems.", 1900, "dim");
            delayedLine("Recorded intent: eradication of abominations.", 2600);
            delayedLine("Army response limiter: FAILED.", 3400, "glitch");
            delayedLine("New directive generated:", 4200, "glitch");
            delayedLine("FIND WHITE DEATH.", 5000, "glitch");
            delayedLine("BREAK WHITE DEATH.", 5700, "glitch");
            delayedLine("RETURN WITH CONFIRMATION.", 6400, "glitch");
            return;
        }

        if (value === "OSIRIS") {
            delayedLine("ENTITY FILE PARTIALLY RESTORED.", 300);
            delayedLine("Name: OSIRIS", 800);
            delayedLine("Origin: UNKNOWN", 1300);
            delayedLine("Hypothesis: Artificial Construct.", 2100);
            delayedLine("Containment status: IN-PROGRESS.", 3000, "dim");
            delayedLine("Conclusion: incomplete thing. still dangerous.", 3900);
            return;
        }

        if (value === "GREED") {
            delayedLine("ARCHIVE INDEX FOUND.", 300);
            delayedLine("Owner: GREED", 800);
            delayedLine("Contents: pre-Era of Peace records.", 1700);
            delayedLine("Archive status: destroyed.", 2800, "glitch");
            delayedLine("Responsible order: V-02.", 3600);
            delayedLine("Truth preserved is still a weapon.", 4600, "dim");
            return;
        }

        typeLine("ACCESS DENIED");
    }
});

function openVideo() {
    document.getElementById("terminal").style.display = "none";
    document.getElementById("files").style.display = "none";
    document.getElementById("fileViewer").style.display = "none";

    const video = document.getElementById("videoContainer");
    const img = document.getElementById("simVideo");

    img.src = "Sim_01.gif?t=" + Date.now();
    video.style.display = "block";
}

function exitVideo() {
    document.getElementById("videoContainer").style.display = "none";
    document.getElementById("terminal").style.display = "block";
    input.focus();
}

function startEndoscopy() {
    const container = document.getElementById("endoContainer");
    container.innerHTML = "";

    let speed = 900;
    let spawned = 0;

    function spawnImage() {
        const img = document.createElement("img");
        img.src = "m.png";
        img.className = "endo-img";

        img.style.left = Math.random() * (window.innerWidth - 180) + "px";
        img.style.top = Math.random() * (window.innerHeight - 180) + "px";

        container.appendChild(img);

        spawned++;
        speed *= 0.82;
        if (speed < 35) speed = 35;

        if (spawned < 120) {
            setTimeout(spawnImage, speed);
        }
    }

    spawnImage();
}

function fileLine(name, cls = "") {
    return `<div class="line ${cls}" onclick="openFile('${name}')" data-text="> ${name}">> ${name}</div>`;
}

function neitherLine() {
    return `<div class="line uncertain-file" onclick="openFile('NEITHER.txt')" data-text="> NEITHER.txt" onmouseenter="this.textContent='> FLAWEDVIRTUE.txt';this.setAttribute('data-text','> FLAWEDVIRTUE.txt')" onmouseleave="this.textContent='> NEITHER.txt';this.setAttribute('data-text','> NEITHER.txt')">> NEITHER.txt</div>`;
}

function openFiles() {
    document.getElementById("terminal").style.display = "none";

    const files = document.getElementById("files");
    files.style.display = "block";

    files.innerHTML = `
<div class="line" data-text="ACCESS GRANTED">ACCESS GRANTED</div><br>

<div class="line" data-text="----- ALLIES -----">----- ALLIES -----</div>
${fileLine("KINDNESS.txt")}
${fileLine("PATIENCE.txt")}
${fileLine("URIEL.txt")}
${fileLine("FORGOTTENHERO.txt")}

<br>

<div class="line red-file" data-text="----- HERETICS -----">----- HERETICS -----</div>
${fileLine("GREED.txt", "red-file")}
${fileLine("WRATH.txt", "red-file")}
${fileLine("DEADMAN.txt", "red-file")}
${fileLine("OSIRIS.txt", "red-file")}
${fileLine("FOOL.txt", "red-file")}

<br>

<div class="line" data-text="----- OTHER -----">----- OTHER -----</div>
${fileLine("PROTOTYPEA2.txt")}
${neitherLine()}
${fileLine("Last Signal.wav")}
`;
}

function openFile(name) {
    document.getElementById("files").style.display = "none";
    document.getElementById("fileViewer").style.display = "block";

    const content = fileData[name] || "EMPTY FILE";
    const container = document.getElementById("fileContent");
    container.innerHTML = "";

    content.split("\n").forEach(lineText => {
        const div = document.createElement("div");
        div.className = "line";
        div.textContent = lineText;
        div.setAttribute("data-text", lineText);
        container.appendChild(div);
    });
}

function backToFiles() {
    document.getElementById("fileViewer").style.display = "none";
    document.getElementById("files").style.display = "block";
}
</script>

</body>
</html>
