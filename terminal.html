<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>system</title>

<style>
@font-face {
    font-family: 'VCR';
    src: url('VCR_OSD_MONO.ttf');
}

body {
    margin: 0;
    background: black;
    font-family: 'VCR', monospace;
    overflow: hidden;
}

body::after {
    content: "";
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
        to bottom,
        rgba(255,255,255,0.03),
        rgba(255,255,255,0.03) 1px,
        transparent 2px
    );
    pointer-events: none;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: radial-gradient(
        circle at center,
        transparent 40%,
        rgba(0,0,0,0.6) 100%
    );
    pointer-events: none;
}

.line {
    position: relative;
    color: white;
    font-size: 18px;
}

.line::before {
    content: attr(data-text);
    position: absolute;
    left: 0;
    top: 0;
    color: red;
    opacity: 0.3;
    transform: translate(2px, 0);
}

.line::after {
    content: attr(data-text);
    position: absolute;
    left: 0;
    top: 0;
    color: cyan;
    opacity: 0.3;
    transform: translate(-2px, 0);
}

#terminal {
    padding: 20px;
}

.input-line {
    display: flex;
}

input {
    background: black;
    border: none;
    color: white;
    font-family: inherit;
    outline: none;
    width: 100%;
}

#files {
    display: none;
    padding: 20px;
    color: white;
}

.file {
    cursor: pointer;
    margin: 6px 0;
}

.file:hover {
    color: red;
}

#viewer {
    margin-top: 20px;
}

#videoContainer {
    display: none;
    position: fixed;
    inset: 0;
    background: black;
}

video {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

#loopText {
    display: none;
    position: absolute;
    inset: 0;
    font-size: 60px;
    white-space: nowrap;
    overflow: hidden;
    color: white;
}

.marquee {
    animation: scroll 3s linear infinite;
}

@keyframes scroll {
    from { transform: translateX(100%); }
    to { transform: translateX(-100%); }
}
</style>
</head>

<body>

<div id="terminal">
    <div id="output"></div>

    <div class="input-line">
        <span class="line" data-text="> ">> </span>
        <input id="input" autofocus>
    </div>
</div>

<div id="files">
    <h3>root://classified</h3>

    <div class="file" onclick="openFile('patience')">Patience.txt</div>
    <div class="file" onclick="openFile('kindness')">Kindness.txt</div>
    <div class="file" onclick="openFile('uriel')">Uriel.txt</div>
    <div class="file" onclick="openFile('commander')">Commander.txt</div>

    <div id="viewer"></div>
</div>

<div id="videoContainer">
    <video id="vid" src="Sim_01.mp4" autoplay></video>
</div>

<div id="loopText"></div>

<script>
const output = document.getElementById("output");
const input = document.getElementById("input");

let attempts = 0;

function typeLine(text, delay = 20) {
    return new Promise(resolve => {
        let i = 0;

        const line = document.createElement("div");
        line.className = "line";
        output.appendChild(line);

        function typing() {
            if (i < text.length) {
                line.textContent += text[i];
                line.setAttribute("data-text", line.textContent);
                i++;
                setTimeout(typing, delay);
            } else {
                resolve();
            }
        }

        typing();
    });
}

async function init() {
    await typeLine("ENTER CODE:");
}

init();

input.addEventListener("keydown", function(e) {
    if (e.key === "Enter") {
        const value = input.value;
        input.value = "";

        typeLine("> " + value);

        if (value === "ABA") {
            document.getElementById("terminal").style.display = "none";
            document.getElementById("videoContainer").style.display = "block";
            document.getElementById("vid").play();
            return;
        }

        if (value === "PROTOTYPEA1") {
            document.getElementById("terminal").style.display = "none";
            document.getElementById("files").style.display = "block";
            return;
        }

        if (value === "CANNONFODDER") {
            document.getElementById("terminal").style.display = "none";

            const loop = document.getElementById("loopText");
            loop.style.display = "block";

            for (let i = 0; i < 20; i++) {
                const line = document.createElement("div");
                line.className = "marquee";
                line.innerText = "LIVE AGAIN LIVE AGAIN DIES STOP";
                loop.appendChild(line);
            }
            return;
        }

        attempts++;
        typeLine("ACCESS DENIED");

        if (attempts >= 3) {
            typeLine("YOUR LOCATION HAS BEEN LOGGED");
        }
    }
});

function openFile(name) {
    const viewer = document.getElementById("viewer");

    if (name === "patience") {
        viewer.innerHTML = "<h4>Patience.txt</h4><p>[DATA REDACTED]</p>";
    }

    if (name === "kindness") {
        viewer.innerHTML = "<h4>Kindness.txt</h4><p>[DATA REDACTED]</p>";
    }

    if (name === "uriel") {
        viewer.innerHTML = "<h4>Uriel.txt</h4><p>[DATA REDACTED]</p>";
    }

    if (name === "commander") {
        viewer.innerHTML = "<h4>Commander.txt</h4><p>[DATA REDACTED]</p>";
    }
}
</script>

</body>
</html>
