<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>system</title>

<style>
@font-face {
    font-family: 'VCR';
    src: url('VCR_OSD_MONO.ttf');
}

body {
    margin: 0;
    background: black;
    font-family: 'VCR', monospace;
    overflow: hidden;
}

/* CRT */
body::after {
    content: "";
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
        to bottom,
        rgba(255,255,255,0.03),
        rgba(255,255,255,0.03) 1px,
        transparent 2px
    );
    pointer-events: none;
}

/* FISHEYE */
body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: radial-gradient(
        circle at center,
        transparent 40%,
        rgba(0,0,0,0.7) 100%
    );
    pointer-events: none;
}

/* TEXT */
.line {
    position: relative;
    color: white;
    font-size: 18px;
    cursor: pointer;
}

.line::before {
    content: attr(data-text);
    position: absolute;
    left: 0;
    top: 0;
    color: red;
    opacity: 0.3;
    transform: translate(2px, 0);
}

.line::after {
    content: attr(data-text);
    position: absolute;
    left: 0;
    top: 0;
    color: cyan;
    opacity: 0.3;
    transform: translate(-2px, 0);
}

#terminal {
    padding: 20px;
}

.input-line {
    display: flex;
}

input {
    background: black;
    border: none;
    color: white;
    font-family: inherit;
    outline: none;
    width: 100%;
}

/* FILES */
#files, #fileViewer {
    display: none;
    padding: 20px;
    color: white;
}

#fileViewer pre {
    white-space: pre-wrap;
}

/* GIF */
#videoContainer {
    display: none;
    position: fixed;
    inset: 0;
    background: black;
}

img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

/* EXIT BUTTON */
#exitBtn {
    position: absolute;
    top: 20px;
    right: 20px;
    background: black;
    color: white;
    border: 1px solid red;
    padding: 10px;
    cursor: pointer;
    z-index: 10;
}

/* BACK BUTTON */
#backBtn {
    margin-bottom: 20px;
    border: 1px solid red;
    padding: 5px;
    display: inline-block;
    cursor: pointer;
}

/* CANNONFODDER */
#rain {
    display: none;
    position: fixed;
    inset: 0;
    padding: 20px;
    color: red;
    font-size: 18px;
    overflow: hidden;
    white-space: pre-wrap;
    word-break: break-word;
}
</style>
</head>

<body>

<div id="terminal">
    <div id="output"></div>

    <div class="input-line">
        <span class="line" data-text="> ">> </span>
        <input id="input" autofocus>
    </div>
</div>

<div id="files"></div>

<div id="fileViewer">
    <div id="backBtn" onclick="closeFile()">← BACK</div>
    <pre id="fileContent"></pre>
</div>

<div id="videoContainer">
    <button id="exitBtn" onclick="exitVideo()">EXIT</button>
    <img src="Sim_01.gif">
</div>

<div id="rain"></div>

<script>
const output = document.getElementById("output");
const input = document.getElementById("input");

let attempts = 0;

/* FILE CONTENTS */
const fileData = {
    "kindness.txt": `KINDNESS MODULE v1.2

Status: CORRUPTED

> they told us to be kind
> we tried
> it didn't work

ERROR: emotional overflow detected`,

    "uriel.log": `URIEL SYSTEM LOG

[ENTRY 01] signal received
[ENTRY 02] subject responding
[ENTRY 03] anomaly detected
[ENTRY 04] containment failed

...log truncated...`,

    "patience.txt": `PATIENCE PROTOCOL

please wait...
please wait...
please wait...

why are you still here?`
};

/* typing */
function typeLine(text, delay = 15) {
    return new Promise(resolve => {
        let i = 0;

        const line = document.createElement("div");
        line.className = "line";
        output.appendChild(line);

        function typing() {
            if (i < text.length) {
                line.textContent += text[i];
                line.setAttribute("data-text", line.textContent);
                i++;
                setTimeout(typing, delay);
            } else {
                resolve();
            }
        }

        typing();
    });
}

typeLine("ENTER CODE:");

input.addEventListener("keydown", function(e) {
    if (e.key === "Enter") {
        let value = input.value.trim().toUpperCase();
        input.value = "";

        typeLine("> " + value);

        if (value === "ABA") {
            document.getElementById("terminal").style.display = "none";
            document.getElementById("videoContainer").style.display = "block";
            return;
        }

        if (value === "CANNONFODDER") {
            document.getElementById("terminal").style.display = "none";
            startRain();
            return;
        }

        if (value === "PROTOTYPEA1") {
            document.getElementById("terminal").style.display = "none";

            const files = document.getElementById("files");
            files.style.display = "block";

            files.innerHTML = `
                <div class="line" onclick="openFile('kindness.txt')" data-text="> kindness.txt">> kindness.txt</div>
                <div class="line" onclick="openFile('uriel.log')" data-text="> uriel.log">> uriel.log</div>
                <div class="line" onclick="openFile('patience.txt')" data-text="> patience.txt">> patience.txt</div>
                <div class="line" data-text="> subject_01.data">> subject_01.data</div>
                <div class="line" data-text="> last_signal.wav">> last_signal.wav</div>
                <div class="line" data-text="> DO_NOT_OPEN.txt">> DO_NOT_OPEN.txt</div>
            `;
            return;
        }

        attempts++;
        typeLine("ACCESS DENIED");

        if (attempts >= 3) {
            typeLine("YOUR LOCATION HAS BEEN LOGGED");
        }
    }
});

/* FILE OPEN */
function openFile(name) {
    document.getElementById("files").style.display = "none";
    document.getElementById("fileViewer").style.display = "block";

    document.getElementById("fileContent").textContent = fileData[name] || "FILE CORRUPTED";
}

function closeFile() {
    document.getElementById("fileViewer").style.display = "none";
    document.getElementById("files").style.display = "block";
}

/* exit gif */
function exitVideo() {
    document.getElementById("videoContainer").style.display = "none";
    document.getElementById("terminal").style.display = "block";
}

/* CANNONFODDER эффект */
function startRain() {
    const rain = document.getElementById("rain");
    rain.style.display = "block";

    let text = "LIVE AGAIN LIVE AGAIN DIES STOP ";
    let fullText = "";

    function flood() {
        fullText += text.repeat(10);
        rain.innerText = fullText;

        if (fullText.length > 20000) {
            setTimeout(() => {
                location.href = "about:blank";
            }, 1000);
            return;
        }

        setTimeout(flood, 20);
    }

    flood();
}
</script>

</body>
</html>
