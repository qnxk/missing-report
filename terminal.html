<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>system</title>

<style>
@font-face {
    font-family: 'VCR';
    src: url('VCR_OSD_MONO.ttf');
}

body {
    margin: 0;
    background: black;
    font-family: 'VCR', monospace;
    overflow: hidden;
}

.line {
    color: white;
    font-size: 18px;
    cursor: pointer;
}

.red-file {
    color: #ff0000;
}

.blue-file {
    color: #66ccff;
}

#files, #fileViewer, #videoContainer, #rain {
    display: none;
    padding: 20px;
}

input {
    background: black;
    border: none;
    color: white;
    outline: none;
    width: 100%;
}
</style>
</head>

<body>

<div id="terminal">
    <div id="output"></div>
    <div>
        > <input id="input" autofocus>
    </div>
</div>

<div id="files"></div>

<div id="fileViewer">
    <div onclick="backToFiles()">[BACK]</div>
    <div id="fileContent"></div>
</div>

<div id="videoContainer">
    <button onclick="exitVideo()">EXIT</button>
    <img src="Sim_01.gif">
</div>

<div id="rain"></div>

<script>
const output = document.getElementById("output");
const input = document.getElementById("input");

const fileData = {
    "TFH.txt": "THE FORGOTTEN HERO\n\nAffiliation: Virtues\nStatus: Active\n\nLog:\nTFH serves beside Kindness and still holds onto duty, loyalty, and doubt. He senses corruption in others, especially The Flawed Virtue.",

    "Kindness.txt": "KINDNESS\n\nAffiliation: Virtues\nStatus: Active\n\nLog:\nKindness ordered the destruction of ancient archives. She believes the past must remain buried to protect the world.",

    "Patience.txt": "PATIENCE\n\nAffiliation: Virtues\nStatus: Active\n\nLog:\nPatience treats rebellion as necessary. Suppression is used to maintain strength among soldiers.",

    "Uriel.log": "URIEL\n\nAffiliation: Virtues\nStatus: Active\n\nLog:\nUriel believes fear creates devotion. Public demonstrations of divine power are encouraged.",

    "The Greed.txt": "THE GREED\n\nAffiliation: Virtues\nStatus: Active\n\nLog:\nKeeper of archives. Lost knowledge about the world’s original state was destroyed.",

    "The Wrath.txt": "THE WRATH\n\nAffiliation: Virtues\nStatus: Active\n\nLog:\nDriven by vengeance. Opposes divine judgment but lacks power to challenge it fully.",

    "PrototypeA2.txt": "PROTOTYPE A2\n\nAffiliation: Unknown\nStatus: Fragment Recovered\n\nLog:\nOnly a severed arm has been recovered. Emits constant electrical discharge.",

    "Last_Signal.wav": "LAST SIGNAL\n\nAffiliation: Unknown\nStatus: Corrupted\n\nLog:\nERROR: Cannot decode audio.",

    "The Deadman.txt": "THE DEADMAN\n\nAffiliation: Rogue\nStatus: Active\n\nLog:\nFormer human. Now barely responsive. Produces distorted sounds and unstable behavior.",

    "Osiris.txt": "OSIRIS\n\nAffiliation: Unknown\nStatus: Active\n\nLog:\nOrigin unknown. Communication minimal. Possibly artificial or incomplete entity.",

    "The Fool.txt": "THE FOOL\n\nAffiliation: Unknown\nStatus: Anomaly\n\nLog:\nLinked to ancient powers. Displays knowledge that should not exist. Highly unpredictable."
};

let attempts = 0;

function typeLine(text) {
    const div = document.createElement("div");
    div.textContent = text;
    output.appendChild(div);
}

typeLine("ENTER CODE:");

input.addEventListener("keydown", function(e) {
    if (e.key === "Enter") {
        let value = input.value.trim().toUpperCase();
        input.value = "";
        typeLine("> " + value);

        if (value === atob("QUJB")) {
            document.getElementById("terminal").style.display = "none";
            document.getElementById("videoContainer").style.display = "block";
            return;
        }

        if (value === "PROTOTYPEA1") {
            openFiles();
            return;
        }

        attempts++;
        typeLine("ACCESS DENIED");
    }
});

function openFiles() {
    document.getElementById("terminal").style.display = "none";
    const files = document.getElementById("files");
    files.style.display = "block";

    files.innerHTML = `
        <div>ACCESS GRANTED</div><br>
        ${Object.keys(fileData).map(name => {
            const isEnemy = ["The Deadman.txt","Osiris.txt","The Greed.txt","The Wrath.txt","The Fool.txt"].includes(name);
            const isVirtue = ["TFH.txt","Kindness.txt","Patience.txt","Uriel.log"].includes(name);

            let cls = "";
            if (isEnemy) cls = "red-file";
            if (isVirtue) cls = "blue-file";

            return `<div class="${cls}" onclick="openFile('${name}')">> ${name}</div>`;
        }).join("")}
    `;
}

function openFile(name) {
    document.getElementById("files").style.display = "none";
    document.getElementById("fileViewer").style.display = "block";

    const container = document.getElementById("fileContent");
    container.innerHTML = fileData[name].replace(/\n/g, "<br>");
}

function backToFiles() {
    document.getElementById("fileViewer").style.display = "none";
    document.getElementById("files").style.display = "block";
}

function exitVideo() {
    document.getElementById("videoContainer").style.display = "none";
    document.getElementById("terminal").style.display = "block";
}
</script>

</body>
</html>
