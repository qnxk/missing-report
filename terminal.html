<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>system</title>

<style>
@font-face {
    font-family: 'VCR';
    src: url('VCR_OSD_MONO.ttf');
}

body {
    margin: 0;
    background: black;
    font-family: 'VCR', monospace;
    overflow: hidden;
}

body::after {
    content: "";
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
        to bottom,
        rgba(255,255,255,0.08),
        rgba(255,255,255,0.08) 2px,
        rgba(0,0,0,0) 4px
    );
    pointer-events: none;
}

#terminal {
    padding: 20px;
    position: relative;
}

#terminal::before {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(
        circle at center,
        transparent 40%,
        rgba(0,0,0,0.7) 100%
    );
    pointer-events: none;
}

.line {
    position: relative;
    color: white;
    font-size: 18px;
    cursor: pointer;
}

.line::before {
    content: attr(data-text);
    position: absolute;
    left: 0;
    top: 0;
    color: red;
    opacity: 0.3;
    transform: translate(2px, 0);
}

.line::after {
    content: attr(data-text);
    position: absolute;
    left: 0;
    top: 0;
    color: cyan;
    opacity: 0.3;
    transform: translate(-2px, 0);
}

.input-line {
    display: flex;
}

input {
    background: black;
    border: none;
    color: white;
    font-family: inherit;
    outline: none;
    width: 100%;
}

#files, #fileViewer, #videoContainer, #rain {
    display: none;
    padding: 20px;
    color: white;
}

#backBtn {
    margin-bottom: 20px;
    border: 1px solid red;
    display: inline-block;
    padding: 5px 10px;
    cursor: pointer;
}

#exitBtn {
    position: absolute;
    top: 20px;
    right: 20px;
    background: black;
    color: white;
    border: 1px solid red;
    padding: 10px;
    cursor: pointer;
}

img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.red-file {
    color: #ff0000;
}
</style>
</head>

<body>

<div id="terminal">
    <div id="output"></div>
    <div class="input-line">
        <span class="line" data-text="> ">> </span>
        <input id="input" autofocus>
    </div>
</div>

<div id="files"></div>

<div id="fileViewer">
    <div id="backBtn" onclick="backToFiles()">[BACK]</div>
    <div id="fileContent"></div>
</div>

<div id="videoContainer">
    <button id="exitBtn" onclick="exitVideo()">EXIT</button>
    <img src="Sim_01.gif">
</div>

<div id="rain"></div>

<script>
const output = document.getElementById("output");
const input = document.getElementById("input");

const fileData = {
    "Kindness.txt": "KINDNESS\n\nAffiliation: Virtues\nStatus: Active\n\nLog:\nMaintains control through suppression of knowledge.",
    "Patience.txt": "PATIENCE\n\nAffiliation: Virtues\nStatus: Active\n\nLog:\nUses rebellion as training.",
    "Uriel.log": "URIEL\n\nAffiliation: Virtues\nStatus: Active\n\nLog:\nBelieves fear creates devotion.",
    "TFH.txt": "THE FORGOTTEN HERO\n\nAffiliation: Virtues\nStatus: Active\n\nLog:\nFragmented memory. Still loyal.",

    "The Greed.txt": "THE GREED\n\nAffiliation: Heretic\nStatus: Active\n\nLog:\nKeeper of forbidden knowledge.",
    "The Wrath.txt": "THE WRATH\n\nAffiliation: Heretic\nStatus: Active\n\nLog:\nDriven by revenge.",
    "The Deadman.txt": "THE DEADMAN\n\nAffiliation: Heretic\nStatus: Active\n\nLog:\nBarely human.",
    "Osiris.txt": "OSIRIS\n\nAffiliation: Heretic\nStatus: Active\n\nLog:\nUnknown origin.",
    "The Fool.txt": "THE FOOL\n\nAffiliation: Heretic\nStatus: Anomaly\n\nLog:\nUnpredictable.",

    "PrototypeA2.txt": "PROTOTYPE A2\n\nAffiliation: Unknown\nStatus: Fragment\n\nLog:\nSevered arm. Electrical discharge.",
    "Last Signal.wav": "LAST SIGNAL\n\nAffiliation: Unknown\nStatus: Corrupted\n\nLog:\nERROR"
};

function typeLine(text, delay = 15) {
    let i = 0;
    const line = document.createElement("div");
    line.className = "line";
    output.appendChild(line);

    function typing() {
        if (i < text.length) {
            line.textContent += text[i];
            line.setAttribute("data-text", line.textContent);
            i++;
            setTimeout(typing, delay);
        }
    }
    typing();
}

typeLine("ENTER CODE:");

input.addEventListener("keydown", function(e) {
    if (e.key === "Enter") {
        let value = input.value.trim().toUpperCase();
        input.value = "";

        typeLine("> " + value);

        if (value === atob("QUJB")) {
            document.getElementById("terminal").style.display = "none";
            document.getElementById("videoContainer").style.display = "block";
            return;
        }

        if (value === "PROTOTYPEA1") {
            openFiles();
            return;
        }

        typeLine("ACCESS DENIED");
    }
});

function openFiles() {
    document.getElementById("terminal").style.display = "none";
    const files = document.getElementById("files");
    files.style.display = "block";

    const allies = ["Kindness.txt","Patience.txt","Uriel.log","TFH.txt"];
    const heretics = ["The Greed.txt","The Wrath.txt","The Deadman.txt","Osiris.txt","The Fool.txt"];
    const others = ["PrototypeA2.txt","Last Signal.wav"];

    files.innerHTML = `
        <div class="line">ACCESS GRANTED</div><br>

        <div class="line">----- ALLIES -----</div>
        ${allies.map(n => `<div class="line" onclick="openFile('${n}')">> ${n}</div>`).join("")}

        <br>

        <div class="line red-file">----- HERETICS -----</div>
        ${heretics.map(n => `<div class="line red-file" onclick="openFile('${n}')">> ${n}</div>`).join("")}

        <br>

        <div class="line">----- OTHER -----</div>
        ${others.map(n => `<div class="line" onclick="openFile('${n}')">> ${n}</div>`).join("")}
    `;
}

function openFile(name) {
    document.getElementById("files").style.display = "none";
    document.getElementById("fileViewer").style.display = "block";

    const content = fileData[name];
    const container = document.getElementById("fileContent");
    container.innerHTML = "";

    content.split("\n").forEach(lineText => {
        const div = document.createElement("div");
        div.className = "line";
        div.textContent = lineText;
        div.setAttribute("data-text", lineText);
        container.appendChild(div);
    });
}

function backToFiles() {
    document.getElementById("fileViewer").style.display = "none";
    document.getElementById("files").style.display = "block";
}

function exitVideo() {
    document.getElementById("videoContainer").style.display = "none";
    document.getElementById("terminal").style.display = "block";
}
</script>

</body>
</html>
