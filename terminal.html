<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>system</title>

<style>
@font-face {
    font-family: 'VCR';
    src: url('VCR_OSD_MONO.ttf');
}

body {
    margin: 0;
    background: black;
    font-family: 'VCR', monospace;
    overflow: hidden;
}

/* CRT */
body::after {
    content: "";
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
        to bottom,
        rgba(255,255,255,0.08),
        rgba(255,255,255,0.08) 2px,
        transparent 4px
    );
    pointer-events: none;
}

/* vignette */
#terminal::before {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(
        circle at center,
        transparent 40%,
        rgba(0,0,0,0.7) 100%
    );
    pointer-events: none;
}

#terminal {
    padding: 20px;
    position: relative;
}

/* text */
.line {
    position: relative;
    color: white;
    font-size: 18px;
}

.line::before {
    content: attr(data-text);
    position: absolute;
    left: 0;
    top: 0;
    color: red;
    opacity: 0.3;
    transform: translate(2px, 0);
}

.line::after {
    content: attr(data-text);
    position: absolute;
    left: 0;
    top: 0;
    color: cyan;
    opacity: 0.3;
    transform: translate(-2px, 0);
}

.input-line {
    display: flex;
}

input {
    background: black;
    border: none;
    color: white;
    font-family: inherit;
    outline: none;
    width: 100%;
}

/* files */
#files {
    display: none;
    padding: 20px;
    color: white;
}

#fileViewer {
    display: none;
    padding: 20px;
    color: white;
}

#backBtn {
    margin-bottom: 20px;
    border: 1px solid red;
    display: inline-block;
    padding: 5px 10px;
    cursor: pointer;
}

/* video/gif */
#videoContainer {
    display: none;
    position: fixed;
    inset: 0;
    background: black;
}

img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

#exitBtn {
    position: absolute;
    top: 20px;
    right: 20px;
    background: black;
    color: white;
    border: 1px solid red;
    padding: 10px;
    cursor: pointer;
    z-index: 10;
}

/* cannonfodder */
#rain {
    display: none;
    position: fixed;
    inset: 0;
    padding: 20px;
    color: red;
    font-size: 18px;
    overflow: hidden;
    white-space: pre-wrap;
    word-break: break-word;
}

.red-file {
    color: #ff0000;
}
</style>
</head>

<body>

<div id="terminal">
    <div id="output"></div>

    <div class="input-line">
        <span class="line" data-text="> ">> </span>
        <input id="input" autofocus>
    </div>
</div>

<div id="files"></div>

<div id="fileViewer">
    <div id="backBtn" onclick="backToFiles()">[BACK]</div>
    <div id="fileContent"></div>
</div>

<div id="videoContainer">
    <button id="exitBtn" onclick="exitVideo()">EXIT</button>
    <img src="Sim_01.gif">
</div>

<div id="rain"></div>

<script>
const output = document.getElementById("output");
const input = document.getElementById("input");

const fileData = {
    "kindness.txt": "SEARCH MODULE INITIALIZED...\n\nSubject shows emotional instability.",
    "uriel.log": "[LOG 01]\nSignal received.\nSource unknown.",
    "patience.txt": "PATIENCE PROTOCOL ACTIVE...\n\nWaiting...",
    "subject_01.data": "SUBJECT ID: 01\nStatus: ACTIVE",
    "DO_NOT_OPEN.txt": "Why did you open this?",
    "The Deadman": "unidentified1",
    "osiris": "breached containment",
    "The Greed": "unidentified2",
    "The Wrath": "unidentified3"
};

let attempts = 0;

/* typing */
function typeLine(text, delay = 15) {
    return new Promise(resolve => {
        let i = 0;
        const line = document.createElement("div");
        line.className = "line";
        output.appendChild(line);

        function typing() {
            if (i < text.length) {
                line.textContent += text[i];
                line.setAttribute("data-text", line.textContent);
                i++;
                setTimeout(typing, delay);
            } else resolve();
        }

        typing();
    });
}

typeLine("ENTER CODE:");

input.addEventListener("keydown", function(e) {
    if (e.key === "Enter") {
        let value = input.value.trim().toUpperCase();
        input.value = "";

        typeLine("> " + value);

        if (value === "ABA") {
            document.getElementById("terminal").style.display = "none";
            document.getElementById("videoContainer").style.display = "block";
            return;
        }

        if (value === "PROTOTYPEA1") {
            document.getElementById("terminal").style.display = "none";
            const files = document.getElementById("files");
            files.style.display = "block";

            files.innerHTML = `
                <div class="line" data-text="ACCESS GRANTED">ACCESS GRANTED</div><br>
                <div class="line" onclick="logout()" data-text="[LOGOUT]">[LOGOUT]</div><br>
                ${Object.keys(fileData).map(name =>
                    `<div class="line" onclick="openFile('${name}')" data-text="> ${name}">> ${name}</div>`
                ).join("")}
            `;
            return;
        }

        if (value === "CANNONFODDER") {
            document.getElementById("terminal").style.display = "none";
            startRain();
            return;
        }

        attempts++;
        typeLine("ACCESS DENIED");

        if (attempts >= 3) {
            typeLine("YOUR LOCATION HAS BEEN LOGGED");
        }
    }
});

/* files */
function openFile(name) {
    document.getElementById("files").style.display = "none";
    document.getElementById("fileViewer").style.display = "block";

    const content = fileData[name] || "EMPTY FILE";
    const container = document.getElementById("fileContent");
    container.innerHTML = "";

    content.split("\n").forEach(lineText => {
        const div = document.createElement("div");
        div.className = "line";
        div.textContent = lineText;
        div.setAttribute("data-text", lineText);
        container.appendChild(div);
    });
}

function backToFiles() {
    document.getElementById("fileViewer").style.display = "none";
    document.getElementById("files").style.display = "block";
}

function exitVideo() {
    document.getElementById("videoContainer").style.display = "none";
    document.getElementById("terminal").style.display = "block";
}

function logout() {
    document.getElementById("files").style.display = "none";
    document.getElementById("terminal").style.display = "block";
}

/* cannonfodder */
function startRain() { 
    const rain = document.getElementById("rain");
    rain.style.display = "block";

    let text = "LIVE AGAIN LIVE AGAIN DIES STOP ";
    let fullText = "";

    function flood() {
        fullText += text.repeat(10);
        rain.innerText = fullText;

        if (fullText.length > 20000) {
            setTimeout(() => {

                window.open('', '_self');
                window.close();

                document.body.innerHTML = "";
                document.body.style.background = "black";
                document.title = "";

            }, 1000);
            return;
        }

        setTimeout(flood, 20);
    }

    flood();
}
</script>

</body>
</html>
