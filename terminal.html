<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>superhot.exe</title>

<style>

/* 🔤 ШРИФТ (локальный VCR) */
@font-face {
    font-family: 'VCR';
    src: url('VCR_OSD_MONO.ttf');
}

body {
    margin: 0;
    background: black;
    color: #ff3c3c;
    font-family: 'VCR', monospace;
    overflow: hidden;

    /* chromatic aberration */
    text-shadow: 
        2px 0 red,
        -2px 0 cyan;

    /* flicker */
    animation: flicker 0.08s infinite;
}

/* 📺 CRT scanlines */
body::after {
    content: "";
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
        to bottom,
        rgba(255,255,255,0.04),
        rgba(255,255,255,0.04) 1px,
        transparent 2px
    );
    pointer-events: none;
}

/* 🌀 Fisheye */
body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: radial-gradient(
        circle at center,
        transparent 40%,
        rgba(0,0,0,0.6) 100%
    );
    pointer-events: none;
}

/* 🎬 flicker */
@keyframes flicker {
    0% { opacity: 1; }
    50% { opacity: 0.97; }
    100% { opacity: 1; }
}

#terminal {
    padding: 20px;
}

.input-line {
    display: flex;
}

input {
    background: black;
    border: none;
    color: #ff3c3c;
    font-family: inherit;
    outline: none;
    width: 100%;
}

/* 📂 FILE SYSTEM */
#files {
    display: none;
    padding: 20px;
}

.file {
    cursor: pointer;
    margin: 6px 0;
}

.file:hover {
    color: white;
}

#viewer {
    margin-top: 20px;
}

/* 💀 CANNONFODDER */
#loopText {
    display: none;
    position: absolute;
    inset: 0;
    font-size: 60px;
    white-space: nowrap;
    overflow: hidden;
    color: #ff0000;
}

.marquee {
    animation: scroll 3s linear infinite;
}

@keyframes scroll {
    from { transform: translateX(100%); }
    to { transform: translateX(-100%); }
}

/* 🎥 VIDEO */
#videoContainer {
    display: none;
    position: fixed;
    inset: 0;
    background: black;
}

video {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

</style>
</head>

<body>

<!-- TERMINAL -->
<div id="terminal">
    <div id="output"></div>

    <div class="input-line">
        <span>> </span>
        <input id="input" autofocus>
    </div>
</div>

<!-- FILES -->
<div id="files">
    <h3>root://classified</h3>

    <div class="file" onclick="openFile('patience')">Patience.txt</div>
    <div class="file" onclick="openFile('kindness')">Kindness.txt</div>
    <div class="file" onclick="openFile('uriel')">Uriel.txt</div>
    <div class="file" onclick="openFile('commander')">Commander.txt</div>

    <div id="viewer"></div>
</div>

<!-- VIDEO -->
<div id="videoContainer">
    <video id="vid" src="Sim_01.mp4" autoplay></video>
</div>

<!-- CANNONFODDER -->
<div id="loopText"></div>

<script>
const output = document.getElementById("output");
const input = document.getElementById("input");

let attempts = 0;

function print(text) {
    output.innerHTML += text + "<br>";
}

print("SUPERHOT SYSTEM");
print("ENTER CODE:");

input.addEventListener("keydown", function(e) {
    if (e.key === "Enter") {
        const value = input.value;
        input.value = "";

        print("> " + value);

        // 🔑 ABA → видео
        if (value === "ABA") {
            document.getElementById("terminal").style.display = "none";
            const vidContainer = document.getElementById("videoContainer");
            vidContainer.style.display = "block";

            const vid = document.getElementById("vid");
            vid.play();

            return;
        }

        // 🔑 PROTOTYPEA1 → файлы
        if (value === "PROTOTYPEA1") {
            document.getElementById("terminal").style.display = "none";
            document.getElementById("files").style.display = "block";
            return;
        }

        // 🔑 CANNONFODDER → безумный текст
        if (value === "CANNONFODDER") {
            document.getElementById("terminal").style.display = "none";

            const loop = document.getElementById("loopText");
            loop.style.display = "block";

            for (let i = 0; i < 20; i++) {
                const line = document.createElement("div");
                line.className = "marquee";
                line.innerText = "LIVE AGAIN LIVE AGAIN DIES STOP";
                loop.appendChild(line);
            }

            return;
        }

        // ❌ неправильный код
        attempts++;
        print("ACCESS DENIED");

        if (attempts >= 3) {
            print("YOUR LOCATION HAS BEEN LOGGED");
        }
    }
});

/* 📂 FILES */
function openFile(name) {
    const viewer = document.getElementById("viewer");

    if (name === "patience") {
        viewer.innerHTML = "<h4>Patience.txt</h4><p>[DATA REDACTED]</p>";
    }

    if (name === "kindness") {
        viewer.innerHTML = "<h4>Kindness.txt</h4><p>[DATA REDACTED]</p>";
    }

    if (name === "uriel") {
        viewer.innerHTML = "<h4>Uriel.txt</h4><p>[DATA REDACTED]</p>";
    }

    if (name === "commander") {
        viewer.innerHTML = "<h4>Commander.txt</h4><p>[DATA REDACTED]</p>";
    }
}
</script>

</body>
</html>
