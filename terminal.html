<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>system</title>

<style>
@font-face {
    font-family: 'VCR';
    src: url('VCR_OSD_MONO.ttf');
}

body {
    margin: 0;
    background: black;
    font-family: 'VCR', monospace;
    overflow: hidden;
}

/* CRT */
body::after {
    content: "";
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
        to bottom,
        rgba(255,255,255,0.03),
        rgba(255,255,255,0.03) 1px,
        transparent 2px
    );
    pointer-events: none;
}

/* FISHEYE */
body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: radial-gradient(
        circle at center,
        transparent 40%,
        rgba(0,0,0,0.7) 100%
    );
    pointer-events: none;
}

/* TEXT */
.line {
    position: relative;
    color: white;
    font-size: 18px;
}

.line::before {
    content: attr(data-text);
    position: absolute;
    left: 0;
    top: 0;
    color: red;
    opacity: 0.3;
    transform: translate(2px, 0);
}

.line::after {
    content: attr(data-text);
    position: absolute;
    left: 0;
    top: 0;
    color: cyan;
    opacity: 0.3;
    transform: translate(-2px, 0);
}

#terminal {
    padding: 20px;
}

.input-line {
    display: flex;
}

input {
    background: black;
    border: none;
    color: white;
    font-family: inherit;
    outline: none;
    width: 100%;
}

/* FILES */
#files {
    display: none;
    padding: 20px;
    color: white;
}

/* GIF */
#videoContainer {
    display: none;
    position: fixed;
    inset: 0;
    background: black;
}

img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

/* EXIT BUTTON */
#exitBtn {
    position: absolute;
    top: 20px;
    right: 20px;
    background: black;
    color: white;
    border: 1px solid red;
    padding: 10px;
    cursor: pointer;
    z-index: 10;
}

/* CANNONFODDER */
#rain {
    display: none;
    position: fixed;
    inset: 0;
    padding: 20px;
    color: red;
    font-size: 18px;
    overflow: hidden;
    white-space: pre-wrap;
    word-break: break-word;
}
</style>
</head>

<body>

<div id="terminal">
    <div id="output"></div>

    <div class="input-line">
        <span class="line" data-text="> ">> </span>
        <input id="input" autofocus>
    </div>
</div>

<div id="files"></div>

<div id="videoContainer">
    <button id="exitBtn" onclick="exitVideo()">EXIT</button>
    <img id="gif" src="Sim_01.gif">
</div>

<div id="rain"></div>

<script>
const output = document.getElementById("output");
const input = document.getElementById("input");

let attempts = 0;

/* typing */
function typeLine(text, delay = 15) {
    return new Promise(resolve => {
        let i = 0;

        const line = document.createElement("div");
        line.className = "line";
        output.appendChild(line);

        function typing() {
            if (i < text.length) {
                line.textContent += text[i];
                line.setAttribute("data-text", line.textContent);
                i++;
                setTimeout(typing, delay);
            } else {
                resolve();
            }
        }

        typing();
    });
}

typeLine("ENTER CODE:");

input.addEventListener("keydown", function(e) {
    if (e.key === "Enter") {
        let value = input.value.trim().toUpperCase();
        input.value = "";

        typeLine("> " + value);

        if (value === "ABA") {
            document.getElementById("terminal").style.display = "none";
            document.getElementById("videoContainer").style.display = "block";
            return;
        }

        if (value === "CANNONFODDER") {
            document.getElementById("terminal").style.display = "none";
            startRain();
            return;
        }

        if (value === "PROTOTYPEA1") {
            document.getElementById("terminal").style.display = "none";

            const files = document.getElementById("files");
            files.style.display = "block";

            files.innerHTML = `
                <div class="line" data-text="ACCESS GRANTED">ACCESS GRANTED</div>
                <br>
                <div class="line" data-text="> system_logs.txt">> system_logs.txt</div>
                <div class="line" data-text="> subject_data.bin">> subject_data.bin</div>
                <div class="line" data-text="> recovery_protocol.exe">> recovery_protocol.exe</div>
            `;
            return;
        }

        attempts++;
        typeLine("ACCESS DENIED");

        if (attempts >= 3) {
            typeLine("YOUR LOCATION HAS BEEN LOGGED");
        }
    }
});

/* exit gif */
function exitVideo() {
    document.getElementById("videoContainer").style.display = "none";
    document.getElementById("terminal").style.display = "block";
}

/* CANNONFODDER эффект */
function startRain() {
    const rain = document.getElementById("rain");
    rain.style.display = "block";

    let text = "LIVE AGAIN LIVE AGAIN DIES STOP ";
    let fullText = "";

    function flood() {
        fullText += text.repeat(10);
        rain.innerText = fullText;

        if (fullText.length > 20000) {
            setTimeout(() => {
                location.href = "about:blank";
            }, 1000);
            return;
        }

        setTimeout(flood, 20);
    }

    flood();
}
</script>

</body>
</html>
