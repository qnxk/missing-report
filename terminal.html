<script>
const output = document.getElementById("output");
const input = document.getElementById("input");

const fileData = {
    "kindness.txt": "SEARCH MODULE INITIALIZED...\n\nSubject shows emotional instability.\nResponse pattern: inconsistent.\nRecommendation: observe further.",
    "uriel.log": "[LOG 01]\nSignal received.\nSource unknown.\n\n[LOG 02]\nVoice detected.\n'SHe is still alive.'",
    "patience.txt": "PATIENCE PROTOCOL ACTIVE...\n\nWaiting...\nWaiting...\nWaiting...",
    "subject_01.data": "SUBJECT ID: 01\nStatus: ACTIVE",
    "last_signal.wav": "ERROR: Cannot decode audio.",
    "DO_NOT_OPEN.txt": "Why did you open this?",

    "The Deadman": "unidentified1",
    "osiris": "breached containment",
    "The Greed": "unidentified2",
    "The Wrath": "unidentified3"
};

let attempts = 0;

function typeLine(text, delay = 15) {
    return new Promise(resolve => {
        let i = 0;
        const line = document.createElement("div");
        line.className = "line";
        output.appendChild(line);

        function typing() {
            if (i < text.length) {
                line.textContent += text[i];
                line.setAttribute("data-text", line.textContent);
                i++;
                setTimeout(typing, delay);
            } else resolve();
        }

        typing();
    });
}

// ✅ теперь точно выполняется
typeLine("ENTER CODE:");

input.addEventListener("keydown", function(e) {
    if (e.key === "Enter") {
        let value = input.value.trim().toUpperCase();
        input.value = "";

        typeLine("> " + value);

        if (["THEFLAWEDVIRTUE","ENDOSCOPY","COMMANDER"].includes(value)) {
            for (let i = 1; i <= 5; i++) {
                typeLine("test" + i);
            }
            return;
        }

        if (value === "ABA") {
            document.getElementById("terminal").style.display = "none";
            document.getElementById("videoContainer").style.display = "block";
            return;
        }

        if (value === "CANNONFODDER") {
            document.getElementById("terminal").style.display = "none";
            startRain();
            return;
        }

        if (value === "PROTOTYPEA1") {
            document.getElementById("terminal").style.display = "none";

            const files = document.getElementById("files");
            files.style.display = "block";

            files.innerHTML = `
                <div class="line">ACCESS GRANTED</div>
                <br>
                <div id="logoutBtn" class="line" onclick="logout()">[LOGOUT]</div>

                <div class="file-grid">
                    ${Object.keys(fileData).map(name => {
                        const isNew = ["The Deadman","osiris","The Greed","The Wrath"].includes(name);

                        return `
                            <div class="file-item ${isNew ? 'red-file' : ''}" onclick="selectFile(this); openFile('${name}')">
                                <div class="file-icon"></div>
                                <div class="file-name">${name}</div>
                            </div>
                        `;
                    }).join("")}
                </div>
            `;
            return;
        }

        attempts++;
        typeLine("ACCESS DENIED");

        if (attempts >= 3) {
            typeLine("YOUR LOCATION HAS BEEN LOGGED");
        }
    }
});

function selectFile(el) {
    document.querySelectorAll('.file-item').forEach(f => f.classList.remove('selected'));
    el.classList.add('selected');
}

function openFile(name) {
    document.getElementById("files").style.display = "none";
    document.getElementById("fileViewer").style.display = "block";

    const content = fileData[name] || "EMPTY FILE";
    const container = document.getElementById("fileContent");

    container.innerHTML = "";

    content.split("\n").forEach(lineText => {
        const div = document.createElement("div");
        div.className = "line";
        div.textContent = lineText;
        div.setAttribute("data-text", lineText);
        container.appendChild(div);
    });
}

function backToFiles() {
    document.getElementById("fileViewer").style.display = "none";
    document.getElementById("files").style.display = "block";
}

function exitVideo() {
    document.getElementById("videoContainer").style.display = "none";
    document.getElementById("terminal").style.display = "block";
}

function logout() {
    document.getElementById("files").style.display = "none";
    document.getElementById("terminal").style.display = "block";
}

function startRain() {
    const rain = document.getElementById("rain");
    rain.style.display = "block";

    let text = "LIVE AGAIN LIVE AGAIN DIES STOP ";
    let fullText = "";

    function flood() {
        fullText += text.repeat(10);
        rain.innerText = fullText;

        if (fullText.length > 20000) {
            setTimeout(() => {
                location.href = "about:blank";
            }, 1000);
            return;
        }

        setTimeout(flood, 20);
    }

    flood();
}
</script>
