<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>system</title>

<style>
@font-face {
    font-family: 'VCR';
    src: url('VCR_OSD_MONO.ttf');
}

body {
    margin: 0;
    background: black;
    font-family: 'VCR', monospace;
    overflow: hidden;
}

body::after {
    content: "";
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
        to bottom,
        rgba(255,255,255,0.08),
        rgba(255,255,255,0.08) 2px,
        rgba(0,0,0,0) 4px
    );
    pointer-events: none;
}

#terminal {
    padding: 20px;
    position: relative;
}

#terminal::before {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at center, transparent 40%, rgba(0,0,0,0.7) 100%);
}

.line {
    position: relative;
    color: white;
    font-size: 18px;
}

.line::before {
    content: attr(data-text);
    position: absolute;
    color: red;
    opacity: 0.3;
    transform: translate(2px,0);
}

.line::after {
    content: attr(data-text);
    position: absolute;
    color: cyan;
    opacity: 0.3;
    transform: translate(-2px,0);
}

input {
    background: black;
    border: none;
    color: white;
    width: 100%;
    outline: none;
}

.red-file { color:#ff0000; }
.uncertain-file { color:#d6a0a0; }

.glitch {
    color:#ff4444;
    animation: glitch 0.1s infinite;
}

@keyframes glitch {
    0% {transform:translate(0);}
    50% {transform:translate(2px,-1px);}
    100% {transform:translate(-2px,1px);}
}
</style>
</head>

<body>

<div id="terminal">
    <div id="output"></div>
    <div>> <input id="input" autofocus></div>
</div>

<div id="files" style="display:none"></div>
<div id="fileViewer" style="display:none">
    <div onclick="backToFiles()">[BACK]</div>
    <div id="fileContent"></div>
</div>

<script>
const output = document.getElementById("output");
const input = document.getElementById("input");

function typeLine(text, cls="") {
    const div = document.createElement("div");
    div.className = "line "+cls;
    div.textContent = text;
    div.setAttribute("data-text", text);
    output.appendChild(div);
}

typeLine("ENTER CODE:");

input.addEventListener("keydown", e=>{
if(e.key==="Enter"){
let value=input.value.toUpperCase().trim();
input.value="";
typeLine("> "+value);

// ==== КОДЫ ====

if(value==="PROTOTYPEA1"){ openFiles(); return; }

if(value===atob("QUJB")){
    document.body.style.background="black";
    typeLine("...","");
    return;
}

if(value==="COMMANDER"){
    typeLine("AUTHORITY DETECTED");
    typeLine("Squad Seven, advance.");
    typeLine("Move out.");
    return;
}

if(value==="THEFLAWEDVIRTUE"){
    typeLine("WARNING: CORRUPTION");
    typeLine("Something is different...");
    typeLine("What was sealed from me?");
    return;
}

if(value==="ENDOSCOPY"){
    typeLine("SCANNING...");
    typeLine("Fragment found.");
    typeLine("...what went wrong?");
    return;
}

if(value==="WHITEDEATH"){
    typeLine("HOSTILE ENTITY", "glitch");
    typeLine("Threat: HIGH", "glitch");
    typeLine("Objective: Kill Virtues", "glitch");
    setTimeout(()=>{
        if(Math.random()<0.6){
            typeLine("CONNECTION LOST...", "glitch");
            input.disabled=true;
        }
    },1200);
    return;
}

if(value==="OSIRIS"){
    typeLine("UNKNOWN ENTITY");
    typeLine("Origin undefined");
    return;
}

if(value==="GREED"){
    typeLine("ARCHIVE ERROR");
    typeLine("Data erased");
    return;
}

typeLine("ACCESS DENIED");
}
});

function openFiles(){
document.getElementById("terminal").style.display="none";
let files=document.getElementById("files");
files.style.display="block";

files.innerHTML=`
<div class="line">ACCESS GRANTED</div><br>

<div class="line">----- ALLIES -----</div>
<div class="line" onclick="openFile('Kindness.txt')">> Kindness.txt</div>
<div class="line" onclick="openFile('Patience.txt')">> Patience.txt</div>
<div class="line" onclick="openFile('Uriel.log')">> Uriel.log</div>
<div class="line" onclick="openFile('TFH.txt')">> TFH.txt</div>

<br>

<div class="line red-file">----- HERETICS -----</div>
<div class="line red-file" onclick="openFile('The Greed.txt')">> The Greed.txt</div>
<div class="line red-file" onclick="openFile('The Wrath.txt')">> The Wrath.txt</div>
<div class="line red-file" onclick="openFile('The Deadman.txt')">> The Deadman.txt</div>
<div class="line red-file" onclick="openFile('Osiris.txt')">> Osiris.txt</div>
<div class="line red-file" onclick="openFile('The Fool.txt')">> The Fool.txt</div>

<br>

<div class="line">----- OTHER -----</div>
<div class="line" onclick="openFile('PrototypeA2.txt')">> PrototypeA2.txt</div>

<div class="line uncertain-file"
onclick="openFile('The Neither.txt')"
onmouseenter="this.textContent='> The Flawed Virtue.txt'"
onmouseleave="this.textContent='> The Neither.txt'">
> The Neither.txt</div>

<div class="line">> Last Signal.wav</div>
`;
}

function openFile(name){
document.getElementById("files").style.display="none";
document.getElementById("fileViewer").style.display="block";
document.getElementById("fileContent").innerText=name+" OPENED";
}

function backToFiles(){
document.getElementById("fileViewer").style.display="none";
document.getElementById("files").style.display="block";
}
</script>

</body>
</html>
