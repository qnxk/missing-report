<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>system</title>

<style>
@font-face {
    font-family: 'VCR';
    src: url('VCR_OSD_MONO.ttf');
}

body {
    margin: 0;
    background: black;
    font-family: 'VCR', monospace;
    overflow: hidden;
}

body::after {
    content: "";
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
        to bottom,
        rgba(255,255,255,0.08),
        rgba(255,255,255,0.08) 2px,
        rgba(0,0,0,0) 4px
    );
    pointer-events: none;
}

#terminal {
    padding: 20px;
    position: relative;
}

#terminal::before {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(
        circle at center,
        transparent 40%,
        rgba(0,0,0,0.7) 100%
    );
    pointer-events: none;
}

.line {
    position: relative;
    color: white;
    font-size: 18px;
    cursor: pointer;
}

.line::before {
    content: attr(data-text);
    position: absolute;
    left: 0;
    top: 0;
    color: red;
    opacity: 0.3;
    transform: translate(2px, 0);
}

.line::after {
    content: attr(data-text);
    position: absolute;
    left: 0;
    top: 0;
    color: cyan;
    opacity: 0.3;
    transform: translate(-2px, 0);
}

.input-line {
    display: flex;
}

input {
    background: black;
    border: none;
    color: white;
    font-family: inherit;
    outline: none;
    width: 100%;
}

#videoContainer {
    display: none;
    position: fixed;
    inset: 0;
    background: black;
}

#exitBtn {
    position: absolute;
    top: 20px;
    right: 20px;
    background: black;
    color: white;
    border: 1px solid red;
    padding: 10px;
    cursor: pointer;
}

img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.glitch {
    color: #ff4444;
    animation: glitchShake 0.15s infinite;
}

@keyframes glitchShake {
    0% { transform: translate(0, 0); }
    25% { transform: translate(2px, -1px); }
    50% { transform: translate(-2px, 1px); }
    75% { transform: translate(1px, 2px); }
    100% { transform: translate(0, 0); }
}
</style>
</head>

<body>

<div id="terminal">
    <div id="output"></div>
    <div class="input-line">
        <span class="line" data-text="> ">> </span>
        <input id="input" autofocus>
    </div>
</div>

<div id="videoContainer">
    <button id="exitBtn" onclick="exitVideo()">EXIT</button>
    <img src="Sim_01.gif">
</div>

<script>
const output = document.getElementById("output");
const input = document.getElementById("input");

function typeLine(text, delay = 15, className = "") {
    let i = 0;
    const line = document.createElement("div");
    line.className = "line " + className;
    output.appendChild(line);

    function typing() {
        if (i < text.length) {
            line.textContent += text[i];
            line.setAttribute("data-text", line.textContent);
            i++;
            setTimeout(typing, delay);
        }
    }

    typing();
}

typeLine("ENTER CODE:");

input.addEventListener("keydown", function(e) {
    if (e.key === "Enter") {
        let value = input.value.trim().toUpperCase();
        input.value = "";

        typeLine("> " + value);

        if (value === atob("QUJB")) {
            document.getElementById("terminal").style.display = "none";
            document.getElementById("videoContainer").style.display = "block";
            return;
        }

        if (value === "COMMANDER") {
            typeLine("AUTHORITY SIGNATURE DETECTED...");
            setTimeout(() => typeLine("Squad Seven, advance on the heretic position."), 500);
            setTimeout(() => typeLine("Close enough. Move out."), 1200);
            return;
        }

        if (value === "THEFLAWEDVIRTUE") {
            typeLine("WARNING: DATA CORRUPTION DETECTED");
            setTimeout(() => typeLine("Something is different about you."), 500);
            setTimeout(() => typeLine("What was sealed from me?"), 1000);
            return;
        }

        if (value === "ENDOSCOPY") {
            typeLine("SCANNING INTERNAL MEMORY...");
            setTimeout(() => typeLine("Fragment detected."), 600);
            setTimeout(() => typeLine("...I just need to understand what went wrong."), 1200);
            return;
        }

        if (value === "WHITEDEATH") {
            typeLine("HOSTILE ENTITY DETECTED", 15, "glitch");
            setTimeout(() => typeLine("Designation: WHITE DEATH", 15, "glitch"), 400);
            setTimeout(() => typeLine("Threat Level: HIGH", 15, "glitch"), 900);
            setTimeout(() => typeLine("Known Objective: Termination of Virtues", 15, "glitch"), 1400);
            setTimeout(() => typeLine("Response Protocol: ENGAGE", 15, "glitch"), 1900);
            setTimeout(() => typeLine("...You will not complete your objective.", 15, "glitch"), 2500);

            setTimeout(() => {
                if (Math.random() < 0.5) {
                    typeLine("SIGNAL INSTABILITY DETECTED", 20, "glitch");
                    setTimeout(() => typeLine("CONNECTION LOST...", 35, "glitch"), 700);
                    setTimeout(() => {
                        input.disabled = true;
                    }, 1800);
                }
            }, 3300);

            return;
        }

        if (value === "OSIRIS") {
            typeLine("UNKNOWN ENTITY...");
            setTimeout(() => typeLine("Origin cannot be determined."), 600);
            setTimeout(() => typeLine("...silence detected."), 1200);
            return;
        }

        if (value === "GREED") {
            typeLine("ARCHIVE ACCESS...");
            setTimeout(() => typeLine("Records incomplete."), 600);
            setTimeout(() => typeLine("Three days. All data erased."), 1200);
            return;
        }

        typeLine("ACCESS DENIED");
    }
});

function exitVideo() {
    document.getElementById("videoContainer").style.display = "none";
    document.getElementById("terminal").style.display = "block";
}
</script>

</body>
</html>
