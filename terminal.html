<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>system</title>

<style>
@font-face {
    font-family: 'VCR';
    src: url('VCR_OSD_MONO.ttf');
}

body {
    margin: 0;
    background: black;
    font-family: 'VCR', monospace;
    overflow: hidden;
}

body::after {
    content: "";
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
        to bottom,
        rgba(255,255,255,0.08),
        rgba(255,255,255,0.08) 2px,
        rgba(0,0,0,0) 4px
    );
    pointer-events: none;
}

.line {
    position: relative;
    color: white;
    font-size: 18px;
    white-space: pre;
}

.line::before,
.line::after {
    content: attr(data-text);
    position: absolute;
    left: 0;
    top: 0;
    pointer-events: none;
}

.line::before {
    color: red;
    opacity: 0.3;
    transform: translate(2px,0);
}

.line::after {
    color: cyan;
    opacity: 0.3;
    transform: translate(-2px,0);
}

input {
    background: black;
    border: none;
    color: white;
    width: 100%;
    outline: none;
}

#files, #fileViewer { display:none; padding:20px; }
#videoContainer { display:none; position:fixed; inset:0; background:black; }

.red-file { color:#ff0000; }
.glitch { color:#ff4444; animation: glitch 0.1s infinite; }

@keyframes glitch {
    0%{transform:translate(0)}
    50%{transform:translate(2px,-1px)}
    100%{transform:translate(-2px,1px)}
}

#endoContainer { position:fixed; inset:0; pointer-events:none; }
.endo-img { position:absolute; width:180px; animation:shake .08s infinite; }

@keyframes shake {
    0%{transform:translate(0)}
    50%{transform:translate(4px,-3px)}
    100%{transform:translate(-4px,3px)}
}
</style>
</head>

<body>

<div id="terminal">
<div id="output"></div>
<div class="line" data-text="> ">> <input id="input"></div>
</div>

<div id="files"></div>

<div id="fileViewer">
<div onclick="back()">[BACK]</div>
<div id="fileContent"></div>
</div>

<div id="videoContainer">
<button onclick="exitVideo()">EXIT</button>
<img src="Sim_01.gif">
</div>

<div id="endoContainer"></div>

<script>
const output=document.getElementById("output");
const input=document.getElementById("input");

function line(t,c=""){
let d=document.createElement("div");
d.className="line "+c;
d.textContent=t;
d.setAttribute("data-text",t);
output.appendChild(d);
}

line("ENTER CODE:");

input.addEventListener("keydown",e=>{
if(e.key==="Enter"){
let v=input.value.toUpperCase().trim();
input.value="";
line("> "+v);

// КОДЫ

if(v==="ARCHIVE"){openFiles();return;}

if(v===atob("QUJB")){
document.getElementById("terminal").style.display="none";
document.getElementById("videoContainer").style.display="block";
return;
}

if(v==="WHITEDEATH"){
line("HOSTILE ENTITY DETECTED","glitch");
line("PURSUIT INITIATED","glitch");
return;
}

if(v==="ENDOSCOPY"){startEndoscopy();return;}

line("ACCESS DENIED");
}
});

// ФАЙЛЫ

const fileData={
"KINDNESS.txt":`V-02 Virtue. Controls information. Destroys history.`,
"PATIENCE.txt":`V-03 Virtue. Suppresses all resistance.`,
"URIEL.txt":`Church execution unit.`,
"FORGOTTENHERO.txt":`Broken hero. Still loyal.`,
"GREED.txt":`Archivist. Seeks truth.`,
"WRATH.txt":`Revenge entity.`,
"DEADMAN.txt":`Degraded human corpse.`,
"OSIRIS.txt":`Unknown origin.`,
"FOOL.txt":`Anomaly.`,
"PROTOTYPEA2.txt":`Recovered arm. A2.`,
"NEITHER.txt":`Unstable entity.`,
"Last Signal.wav":`Corrupted signal`
};

function file(n,c=""){
return `<div class="line ${c}" onclick="openFile('${n}')">> ${n}</div>`;
}

function openFiles(){
document.getElementById("terminal").style.display="none";
let f=document.getElementById("files");
f.style.display="block";

f.innerHTML=`
<div>ACCESS GRANTED</div>

<div>----- ALLIES -----</div>
${file("KINDNESS.txt")}
${file("PATIENCE.txt")}
${file("URIEL.txt")}
${file("FORGOTTENHERO.txt")}

<div class="red-file">----- HERETICS -----</div>
${file("GREED.txt","red-file")}
${file("WRATH.txt","red-file")}
${file("DEADMAN.txt","red-file")}
${file("OSIRIS.txt","red-file")}
${file("FOOL.txt","red-file")}

<div>----- OTHER -----</div>
${file("PROTOTYPEA2.txt")}
${file("NEITHER.txt")}
${file("Last Signal.wav")}
`;
}

function openFile(n){
document.getElementById("files").style.display="none";
document.getElementById("fileViewer").style.display="block";
document.getElementById("fileContent").innerText=fileData[n];
}

function back(){
document.getElementById("fileViewer").style.display="none";
document.getElementById("files").style.display="block";
}

function exitVideo(){
document.getElementById("videoContainer").style.display="none";
document.getElementById("terminal").style.display="block";
}

// ENDOSCOPY

function startEndoscopy(){
let c=document.getElementById("endoContainer");
let speed=900;

function spawn(){
let img=document.createElement("img");
img.src="m.png";
img.className="endo-img";
img.style.left=Math.random()*window.innerWidth+"px";
img.style.top=Math.random()*window.innerHeight+"px";
c.appendChild(img);

speed*=0.85;
if(speed<40) speed=40;
setTimeout(spawn,speed);
}

spawn();
}
</script>

</body>
</html>
