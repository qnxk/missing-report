<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>system</title>

<style>
@font-face {
    font-family: 'VCR';
    src: url('VCR_OSD_MONO.ttf');
}

body {
    margin: 0;
    background: black;
    font-family: 'VCR', monospace;
    overflow: hidden;
}

body::after {
    content: "";
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
        to bottom,
        rgba(255,255,255,0.08),
        rgba(255,255,255,0.08) 2px,
        rgba(0,0,0,0) 4px
    );
    pointer-events: none;
    z-index: 1000;
}

#terminal {
    padding: 20px;
    position: relative;
}

.line {
    position: relative;
    color: white;
    font-size: 18px;
    white-space: pre;
    cursor: pointer;
}

.line::before,
.line::after {
    content: attr(data-text);
    position: absolute;
    left: 0;
    top: 0;
    pointer-events: none;
}

.line::before {
    color: red;
    opacity: 0.3;
    transform: translate(2px, 0);
}

.line::after {
    color: cyan;
    opacity: 0.3;
    transform: translate(-2px, 0);
}

input {
    background: black;
    border: none;
    color: white;
    font-family: inherit;
    outline: none;
    width: 100%;
}

#files, #fileViewer {
    display: none;
    padding: 20px;
    color: white;
}

#videoContainer {
    display: none;
    position: fixed;
    inset: 0;
    background: black;
    z-index: 900;
}

#exitBtn {
    position: absolute;
    top: 20px;
    right: 20px;
    background: black;
    color: white;
    border: 1px solid red;
    padding: 10px;
    cursor: pointer;
}

#videoContainer img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.red-file { color:#ff0000; }
.uncertain-file { color:#d6a0a0; }

.glitch {
    color:#ff4444;
    animation: glitch 0.1s infinite;
}

@keyframes glitch {
    0% { transform: translate(0); }
    50% { transform: translate(2px,-1px); }
    100% { transform: translate(-2px,1px); }
}

#endoContainer {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 999;
}

.endo-img {
    position: absolute;
    width: 180px;
    animation: shake 0.08s infinite;
}

@keyframes shake {
    0% { transform: translate(0); }
    50% { transform: translate(4px,-3px); }
    100% { transform: translate(-4px,3px); }
}
</style>
</head>

<body>

<div id="terminal">
    <div id="output"></div>
    <div class="line" data-text="> ">> <input id="input" autofocus></div>
</div>

<div id="files"></div>

<div id="fileViewer">
    <div class="line" onclick="backToFiles()" data-text="[BACK]">[BACK]</div>
    <br>
    <div id="fileContent"></div>
</div>

<div id="videoContainer">
    <button id="exitBtn" onclick="exitVideo()">EXIT</button>
    <img id="simVideo" src="Sim_01.gif">
</div>

<div id="endoContainer"></div>

<script>
const output = document.getElementById("output");
const input = document.getElementById("input");

const fileData = {
"KINDNESS.txt": `ID: V-02
Affiliation: Virtues
Status: Active

Summary:
Outward benevolence. Private large-scale data suppression.`,

"PATIENCE.txt": `ID: V-03
Affiliation: Virtues
Status: Active

Summary:
Brutal suppression. Instability rising.`,

"URIEL.txt": `ID: C-01
Affiliation: Church
Status: Active

Summary:
Devotion enforced through fear.`,

"FORGOTTENHERO.txt": `ID: E-00
Affiliation: Church
Status: Active

Summary:
Fragmented Hero. Loyal.`,

"GREED.txt": `ID: S-01
Affiliation: Heretics
Status: Active

Summary:
Archivist. Seeks truth.`,

"WRATH.txt": `ID: S-02
Affiliation: Heretics
Status: Unknown

Summary:
Extreme hostility.`,

"DEADMAN.txt": `ID: H-03
Affiliation: Heretics
Status: Unknown

Summary:
Degraded human corpse.`,

"OSIRIS.txt": `ID: D-00
Affiliation: Unknown
Status: Active

Summary:
Unknown origin.`,

"FOOL.txt": `ID: ⛶
Affiliation: Unknown
Status: Anomaly

Summary:
Unpredictable.`,

"PROTOTYPEA2.txt": `ID: X-00
Affiliation: Unknown
Status: Fragment

Summary:
Recovered arm. A2.`,

"NEITHER.txt": `ID: X-01
Affiliation: Unknown
Status: Watching

Summary:
Instability detected.`,

"Last Signal.wav": `Corrupted signal`
};

function typeLine(text, cls=""){
    const div=document.createElement("div");
    div.className="line "+cls;
    div.textContent=text;
    div.setAttribute("data-text",text);
    output.appendChild(div);
}

typeLine("ENTER CODE:");

input.addEventListener("keydown", e=>{
if(e.key==="Enter"){
let v=input.value.toUpperCase();
input.value="";
typeLine("> "+v);

if(v==="ARCHIVE"){openFiles();return;}

if(v===atob("QUJB")){
    openVideo();return;
}

if(v==="ENDOSCOPY"){startEndoscopy();return;}

if(v==="WHITEDEATH"){
    typeLine("HOSTILE ENTITY","glitch");
    typeLine("PURSUIT INITIATED","glitch");
    return;
}

typeLine("ACCESS DENIED");
}
});

function openVideo(){
document.getElementById("terminal").style.display="none";
document.getElementById("videoContainer").style.display="block";
}

function exitVideo(){
document.getElementById("videoContainer").style.display="none";
document.getElementById("terminal").style.display="block";
}

function startEndoscopy(){
let c=document.getElementById("endoContainer");
let speed=900;

function spawn(){
let img=document.createElement("img");
img.src="m.png";
img.className="endo-img";
img.style.left=Math.random()*window.innerWidth+"px";
img.style.top=Math.random()*window.innerHeight+"px";
c.appendChild(img);

speed*=0.85;
if(speed<40) speed=40;

setTimeout(spawn,speed);
}
spawn();
}

function fileLine(n,c=""){
return `<div class="line ${c}" onclick="openFile('${n}')">> ${n}</div>`;
}

function openFiles(){
document.getElementById("terminal").style.display="none";
let f=document.getElementById("files");
f.style.display="block";

f.innerHTML=`
<div class="line">ACCESS GRANTED</div>

<div class="line">----- ALLIES -----</div>
${fileLine("KINDNESS.txt")}
${fileLine("PATIENCE.txt")}
${fileLine("URIEL.txt")}
${fileLine("FORGOTTENHERO.txt")}

<div class="line red-file">----- HERETICS -----</div>
${fileLine("GREED.txt","red-file")}
${fileLine("WRATH.txt","red-file")}
${fileLine("DEADMAN.txt","red-file")}
${fileLine("OSIRIS.txt","red-file")}
${fileLine("FOOL.txt","red-file")}

<div class="line">----- OTHER -----</div>
${fileLine("PROTOTYPEA2.txt")}
${fileLine("NEITHER.txt")}
${fileLine("Last Signal.wav")}
`;
}

function openFile(n){
document.getElementById("files").style.display="none";
document.getElementById("fileViewer").style.display="block";
document.getElementById("fileContent").innerText=fileData[n];
}

function backToFiles(){
document.getElementById("fileViewer").style.display="none";
document.getElementById("files").style.display="block";
}
</script>

</body>
</html>
