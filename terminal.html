<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>system</title>

<style>
@font-face {
    font-family: 'VCR';
    src: url('VCR_OSD_MONO.ttf');
}

body {
    margin: 0;
    background: black;
    font-family: 'VCR', monospace;
    overflow: hidden;
}

body::after {
    content: "";
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
        to bottom,
        rgba(255,255,255,0.08),
        rgba(255,255,255,0.08) 2px,
        rgba(0,0,0,0) 4px
    );
    pointer-events: none;
}

#terminal {
    padding: 20px;
    position: relative;
}

#terminal::before {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(
        circle at center,
        transparent 40%,
        rgba(0,0,0,0.7) 100%
    );
    pointer-events: none;
}

.line {
    position: relative;
    color: white;
    font-size: 18px;
    cursor: pointer;
}

.line::before {
    content: attr(data-text);
    position: absolute;
    left: 0;
    top: 0;
    color: red;
    opacity: 0.3;
    transform: translate(2px, 0);
}

.line::after {
    content: attr(data-text);
    position: absolute;
    left: 0;
    top: 0;
    color: cyan;
    opacity: 0.3;
    transform: translate(-2px, 0);
}

.input-line {
    display: flex;
}

input {
    background: black;
    border: none;
    color: white;
    font-family: inherit;
    outline: none;
    width: 100%;
}

#files {
    display: none;
    padding: 20px;
    color: white;
}

#fileViewer {
    display: none;
    padding: 20px;
    color: white;
}

#backBtn {
    margin-bottom: 20px;
    border: 1px solid red;
    display: inline-block;
    padding: 5px 10px;
    cursor: pointer;
}

#videoContainer {
    display: none;
    position: fixed;
    inset: 0;
    background: black;
}

img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

#exitBtn {
    position: absolute;
    top: 20px;
    right: 20px;
    background: black;
    color: white;
    border: 1px solid red;
    padding: 10px;
    cursor: pointer;
    z-index: 10;
}

#rain {
    display: none;
    position: fixed;
    inset: 0;
    padding: 20px;
    color: red;
    font-size: 18px;
    overflow: hidden;
    white-space: pre-wrap;
    word-break: break-word;
}

.red-file {
    color: #ff0000;
}
</style>
</head>

<body>

<div id="terminal">
    <div id="output"></div>

    <div class="input-line">
        <span class="line" data-text="> ">> </span>
        <input id="input" autofocus>
    </div>
</div>

<div id="files"></div>

<div id="fileViewer">
    <div id="backBtn" onclick="backToFiles()">[BACK]</div>
    <div id="fileContent"></div>
</div>

<div id="videoContainer">
    <button id="exitBtn" onclick="exitVideo()">EXIT</button>
    <img src="Sim_01.gif">
</div>

<div id="rain"></div>

<script>
const output = document.getElementById("output");
const input = document.getElementById("input");

// ЧЁТКАЯ СОРТИРОВКА
const fileData = {

    // ===== VIRTUES =====
    "Kindness.txt": "KINDNESS\n\nAffiliation: Virtues\nStatus: Active\n\nLog:\nMaintains control through selective suppression of knowledge.",
    "Patience.txt": "PATIENCE\n\nAffiliation: Virtues\nStatus: Active\n\nLog:\nViews rebellion as necessary for discipline.",
    "Uriel.log": "URIEL\n\nAffiliation: Virtues\nStatus: Active\n\nLog:\nBelieves fear strengthens faith.",
    "TFH.txt": "THE FORGOTTEN HERO\n\nAffiliation: Virtues\nStatus: Active\n\nLog:\nRemembers fragments. Still loyal.",

    // ===== HERETICS =====
    "The Greed.txt": "THE GREED\n\nAffiliation: Heretic\nStatus: Active\n\nLog:\nKeeper of forbidden knowledge.",
    "The Wrath.txt": "THE WRATH\n\nAffiliation: Heretic\nStatus: Active\n\nLog:\nDriven by revenge.",
    "The Deadman.txt": "THE DEADMAN\n\nAffiliation: Heretic\nStatus: Active\n\nLog:\nBarely human.",
    "Osiris.txt": "OSIRIS\n\nAffiliation: Heretic\nStatus: Active\n\nLog:\nOrigin unknown.",
    "The Fool.txt": "THE FOOL\n\nAffiliation: Heretic\nStatus: Anomaly\n\nLog:\nUnpredictable.",

    // ===== OTHER =====
    "PrototypeA2.txt": "PROTOTYPE A2\n\nAffiliation: Unknown\nStatus: Fragment\n\nLog:\nSevered arm. Electrical discharge.",
    "Last Signal.wav": "LAST SIGNAL\n\nAffiliation: Unknown\nStatus: Corrupted\n\nLog:\nERROR"
};

let attempts = 0;

function typeLine(text, delay = 15) {
    return new Promise(resolve => {
        let i = 0;
        const line = document.createElement("div");
        line.className = "line";
        output.appendChild(line);

        function typing() {
            if (i < text.length) {
                line.textContent += text[i];
                line.setAttribute("data-text", line.textContent);
                i++;
                setTimeout(typing, delay);
            } else resolve();
        }

        typing();
    });
}

typeLine("ENTER CODE:");

input.addEventListener("keydown", function(e) {
    if (e.key === "Enter") {
        let value = input.value.trim().toUpperCase();
        input.value = "";

        typeLine("> " + value);

        if (value === atob("QUJB")) {
            document.getElementById("terminal").style.display = "none";
            document.getElementById("videoContainer").style.display = "block";
            return;
        }

        if (value === "PROTOTYPEA1") {
            document.getElementById("terminal").style.display = "none";
            const files = document.getElementById("files");
            files.style.display = "block";

            files.innerHTML = `
                <div class="line">ACCESS GRANTED</div><br>
                ${Object.keys(fileData).map(name => {
                    const isRed = name.startsWith("The ") && !name.includes("TFH") && !name.includes("Prototype") && !name.includes("Last");
                    return `<div class="line ${isRed ? 'red-file' : ''}" onclick="openFile('${name}')">> ${name}</div>`;
                }).join("")}
            `;
            return;
        }

        attempts++;
        typeLine("ACCESS DENIED");
    }
});

function openFile(name) {
    document.getElementById("files").style.display = "none";
    document.getElementById("fileViewer").style.display = "block";

    const content = fileData[name] || "EMPTY FILE";
    const container = document.getElementById("fileContent");

    container.innerHTML = "";

    content.split("\n").forEach(lineText => {
        const div = document.createElement("div");
        div.className = "line";
        div.textContent = lineText;
        div.setAttribute("data-text", lineText);
        container.appendChild(div);
    });
}

function backToFiles() {
    document.getElementById("fileViewer").style.display = "none";
    document.getElementById("files").style.display = "block";
}

function exitVideo() {
    document.getElementById("videoContainer").style.display = "none";
    document.getElementById("terminal").style.display = "block";
}
</script>

</body>
</html>
