<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>system</title>

<style>
@font-face {
    font-family: 'VCR';
    src: url('VCR_OSD_MONO.ttf');
}

body {
    margin: 0;
    background: black;
    font-family: 'VCR', monospace;
    overflow: hidden;
}

body::after {
    content: "";
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
        to bottom,
        rgba(255,255,255,0.08),
        rgba(255,255,255,0.08) 2px,
        rgba(0,0,0,0) 4px
    );
    pointer-events: none;
}

#terminal {
    padding: 20px;
    position: relative;
}

.line {
    position: relative;
    color: white;
    font-size: 18px;
    white-space: pre;
    cursor: pointer;
}

.line::before,
.line::after {
    content: attr(data-text);
    position: absolute;
    left: 0;
    top: 0;
    pointer-events: none;
}

.line::before {
    color: red;
    opacity: 0.3;
    transform: translate(2px, 0);
}

.line::after {
    color: cyan;
    opacity: 0.3;
    transform: translate(-2px, 0);
}

input {
    background: black;
    border: none;
    color: white;
    font-family: inherit;
    outline: none;
    width: 100%;
}

#files, #fileViewer {
    display: none;
    padding: 20px;
    color: white;
}

.red-file {
    color: #ff0000;
}

.uncertain-file {
    color: #d6a0a0;
}

.glitch {
    color: #ff4444;
    animation: glitch 0.1s infinite;
}

@keyframes glitch {
    0% { transform: translate(0); }
    50% { transform: translate(2px, -1px); }
    100% { transform: translate(-2px, 1px); }
}
</style>
</head>

<body>

<div id="terminal">
    <div id="output"></div>
    <div class="line" data-text="> ">> <input id="input" autofocus></div>
</div>

<div id="files"></div>

<div id="fileViewer">
    <div class="line" onclick="backToFiles()" data-text="[BACK]">[BACK]</div>
    <br>
    <div id="fileContent"></div>
</div>

<script>
const output = document.getElementById("output");
const input = document.getElementById("input");

const fileData = {
    "Kindness.txt": "KINDNESS\n\nAffiliation: Virtues\nStatus: Active\n\nLog:\nPublic image: merciful and calm.\nInternal records suggest she ordered the destruction of ancient archives, scriptures, and forgotten history.\nShe believes the Collective Unconscious is too dangerous to be touched again.\nProtects people, but hides the truth from them.\nPossible motive: preservation through control.",

    "Patience.txt": "PATIENCE\n\nAffiliation: Virtues\nStatus: Active\n\nLog:\nMaintains discipline through suppression.\nTreats rebellion attempts as training for soldiers.\nShows increasing aggression and loss of restraint.\nKindness stated his behavior no longer fits his Title.\nKnown to regenerate after fatal damage.\nThreat level remains high even among allied forces.",

    "Uriel.log": "URIEL\n\nAffiliation: Virtues\nStatus: Active\n\nLog:\nServes the Church with absolute devotion.\nBelieves fear creates devotion.\nSupports public demonstrations of divine power despite civil unrest.\nShows strong loyalty toward Kindness.\nConsiders heretics and infernal beings beneath Celestials.\nCombat response: immediate execution by flame.",

    "TFH.txt": "THE FORGOTTEN HERO\n\nAffiliation: Virtues\nStatus: Active\n\nLog:\nServes beside Kindness as her trusted helper.\nStill holds onto duty, loyalty, and old heroic ideals.\nMemory appears fragmented, but emotional response remains stable.\nSenses corruption in The Flawed Virtue.\nQuestioned whether the Virtues are changing.\nStill chooses to stay with Kindness.",

    "The Greed.txt": "THE GREED\n\nAffiliation: Heretic\nStatus: Active\n\nLog:\nFormer keeper of forbidden archives.\nCollected records about the world's original state.\nArchive contained contradictions, ancient history, and erased knowledge.\nMost records were destroyed by order of Kindness.\nShows hatred toward those who burned his work.\nMotivation: preservation of truth, ownership of knowledge.",

    "The Wrath.txt": "THE WRATH\n\nAffiliation: Heretic\nStatus: Active\n\nLog:\nDriven by revenge against Patience.\nRemembers victims of divine judgment and refuses to forgive.\nBelieves Patience's judgment is blind.\nHas killed Patience multiple times, but failed to make it permanent.\nEmotional instability detected.\nCombat pattern: direct assault, high aggression.",

    "The Deadman.txt": "THE DEADMAN\n\nAffiliation: Heretic\nStatus: Active\n\nLog:\nFormer human.\nRecords mention desertion, crime, and attempted execution by hanging.\nCurrent condition: barely human.\nSpeech degraded into coughing, rustling, and gurgling sounds.\nStill recognized by some old allies and enemies.\nPossible remaining memory fragments detected.",

    "Osiris.txt": "OSIRIS\n\nAffiliation: Heretic\nStatus: Active\n\nLog:\nOrigin unknown.\nCommunication minimal.\nKindness claims his origins may never be recovered.\nWhite Death suspects a manufactured or artificial nature.\nNo confirmed creator.\nContainment status uncertain.",

    "The Fool.txt": "THE FOOL\n\nAffiliation: Heretic\nStatus: Anomaly\n\nLog:\nLinked to ancient powers and the Old Deus.\nKindness recognizes him from the Era of Chaos.\nThe Fool denies all direct claims.\nDisplays knowledge of extinct beings and forgotten technology.\nRecognized White Death's railgun model.\nBehavior pattern: calm, mocking, unpredictable.\nThreat level: unknown.",

    "PrototypeA2.txt": "PROTOTYPE A2\n\nAffiliation: Unknown\nStatus: Fragment Recovered\n\nLog:\nOnly one severed arm has been recovered.\nNo head, torso, or full body confirmed.\nThe limb constantly emits electrical discharge.\nMovement sometimes occurs without external input.\nSignal pulses are irregular.\nDo not touch without insulation.",

    "The Neither.txt": "THE NEITHER\n\nAffiliation: Unknown At This Time\nStatus: Under Suspicion\n\nLog:\nRecorded statements show growing resentment toward the Virtues.\nHe questioned why a weakling could awaken his true self while he could not.\nHe repeatedly asked what went wrong and searched for answers about his origin.\nReports mention the united front falling while the Virtues remained inactive.\nPatience requested distance from him.\nWrath called him a mortal challenging a Celestial.\nPrototype A1 has no confirmed betrayal record yet.\nSuspicion level: increasing.",

    "Last Signal.wav": "LAST SIGNAL\n\nAffiliation: Unknown\nStatus: Corrupted\n\nLog:\nAudio file damaged.\nDecoding failed.\nRecovered fragments contain static, breathing, and repeated signal spikes.\nSource unknown.\nPlayback not recommended."
};

function typeLine(text, cls = "") {
    const div = document.createElement("div");
    div.className = "line " + cls;
    div.textContent = text;
    div.setAttribute("data-text", text);
    output.appendChild(div);
}

typeLine("ENTER CODE:");

input.addEventListener("keydown", function(e) {
    if (e.key === "Enter") {
        const value = input.value.toUpperCase().trim();
        input.value = "";

        typeLine("> " + value);

        if (value === "PROTOTYPEA1") {
            openFiles();
            return;
        }

        if (value === atob("QUJB")) {
            typeLine("...");
            return;
        }

        if (value === "COMMANDER") {
            typeLine("AUTHORITY DETECTED");
            typeLine("Squad Seven, advance.");
            typeLine("Move out.");
            return;
        }

        if (value === "THEFLAWEDVIRTUE") {
            typeLine("WARNING: CORRUPTION");
            typeLine("Something is different...");
            typeLine("What was sealed from me?");
            return;
        }

        if (value === "ENDOSCOPY") {
            typeLine("SCANNING...");
            typeLine("Fragment found.");
            typeLine("...what went wrong?");
            return;
        }

        if (value === "WHITEDEATH") {
            typeLine("HOSTILE ENTITY", "glitch");
            typeLine("Threat: HIGH", "glitch");
            typeLine("Objective: Kill Virtues", "glitch");

            setTimeout(() => {
                if (Math.random() < 0.6) {
                    typeLine("CONNECTION LOST...", "glitch");
                    input.disabled = true;
                }
            }, 1200);

            return;
        }

        if (value === "OSIRIS") {
            typeLine("UNKNOWN ENTITY");
            typeLine("Origin undefined");
            return;
        }

        if (value === "GREED") {
            typeLine("ARCHIVE ERROR");
            typeLine("Data erased");
            return;
        }

        typeLine("ACCESS DENIED");
    }
});

function fileLine(name, cls = "") {
    return `<div class="line ${cls}" onclick="openFile('${name}')" data-text="> ${name}">> ${name}</div>`;
}

function neitherLine() {
    return `<div class="line uncertain-file" onclick="openFile('The Neither.txt')" data-text="> The Neither.txt" onmouseenter="this.textContent='> The Flawed Virtue.txt';this.setAttribute('data-text','> The Flawed Virtue.txt')" onmouseleave="this.textContent='> The Neither.txt';this.setAttribute('data-text','> The Neither.txt')">> The Neither.txt</div>`;
}

function openFiles() {
    document.getElementById("terminal").style.display = "none";

    const files = document.getElementById("files");
    files.style.display = "block";

    files.innerHTML = `
<div class="line" data-text="ACCESS GRANTED">ACCESS GRANTED</div><br>

<div class="line" data-text="----- ALLIES -----">----- ALLIES -----</div>
${fileLine("Kindness.txt")}
${fileLine("Patience.txt")}
${fileLine("Uriel.log")}
${fileLine("TFH.txt")}

<br>

<div class="line red-file" data-text="----- HERETICS -----">----- HERETICS -----</div>
${fileLine("The Greed.txt", "red-file")}
${fileLine("The Wrath.txt", "red-file")}
${fileLine("The Deadman.txt", "red-file")}
${fileLine("Osiris.txt", "red-file")}
${fileLine("The Fool.txt", "red-file")}

<br>

<div class="line" data-text="----- OTHER -----">----- OTHER -----</div>
${fileLine("PrototypeA2.txt")}
${neitherLine()}
${fileLine("Last Signal.wav")}
`;
}

function openFile(name) {
    document.getElementById("files").style.display = "none";
    document.getElementById("fileViewer").style.display = "block";

    const content = fileData[name] || "EMPTY FILE";
    const container = document.getElementById("fileContent");
    container.innerHTML = "";

    content.split("\n").forEach(lineText => {
        const div = document.createElement("div");
        div.className = "line";
        div.textContent = lineText;
        div.setAttribute("data-text", lineText);
        container.appendChild(div);
    });
}

function backToFiles() {
    document.getElementById("fileViewer").style.display = "none";
    document.getElementById("files").style.display = "block";
}
</script>

</body>
</html>
